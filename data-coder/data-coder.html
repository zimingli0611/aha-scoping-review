<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据编码助手 · Data Coder</title>
<style>
:root {
  --bg: #f6f2ea; --panel: #fffdf8; --card: #ffffff; --line: #e9e1d5; --line2: #d8ccbb;
  --ink: #29231c; --ink2: #574e44; --muted: #8b8175;
  --brand: #8a5a3b; --brand-soft: #f4e8dc;
  --keep: #2c7a4b; --keep-soft: #e2f1e7; --excl: #c0392b; --excl-soft: #fbe6e2;
  --unsure: #a86b12; --unsure-soft: #fcf0d7;
  --ai: #4b44b0; --ai-soft: #ecebfa;
  --mark: #ffe27a; --todo: #ddd3c5;
  --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 8px 28px rgba(60, 40, 20, .08);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, "Songti SC", "Noto Serif SC", serif;
}
* { box-sizing: border-box; }
html, body, #app { margin: 0; height: 100%; }
body { font: 15px/1.5 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
kbd { font: 600 11px/1 var(--sans); padding: 3px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; margin-left: 6px; }
.hidden { display: none !important; }

/* ---------- 顶栏 ---------- */
.shell { display: flex; flex-direction: column; height: 100%; }
.top { display: flex; align-items: center; gap: 24px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 58px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.prog { flex: 1; min-width: 180px; max-width: 560px; margin: 0 auto; }
.prog .nums { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; }
.prog .nums b { color: var(--ink); font-size: 15px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.k { background: var(--keep); } .dot.x { background: var(--excl); } .dot.t { background: var(--todo); } .dot.a { background: var(--ai); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--todo); }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar .k { background: var(--keep); } .bar .x { background: var(--excl); }
.aibar { margin-top: 6px; height: 4px; border-radius: 99px; background: var(--ai-soft); overflow: hidden; }
.aibar i { display: block; height: 100%; background: var(--ai); transition: width .3s; }
.tools { display: flex; gap: 8px; }
.tb { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line2); background: var(--card); border-radius: 10px; font-size: 13.5px; color: var(--ink2); white-space: nowrap; }
.tb:hover { border-color: var(--brand); color: var(--brand); }
.tb.ai { border-color: #cfcbf3; color: var(--ai); background: var(--ai-soft); }
.tb.ai.on { background: var(--ai); color: #fff; border-color: var(--ai); }

/* ---------- 三栏 ---------- */
.main { display: grid; grid-template-columns: 270px minmax(0, 1fr) 330px; flex: 1; min-height: 0; }
.list { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 14px 8px; }
.tab { border: 1px solid var(--line2); background: transparent; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; color: var(--ink2); }
.tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tab .n { opacity: .65; margin-left: 4px; }
.search { margin: 4px 14px 10px; padding: 7px 11px; border: 1px solid var(--line2); border-radius: 9px; background: var(--card); }
.items { overflow: auto; flex: 1; padding: 0 8px 12px; }
.it { display: grid; grid-template-columns: 30px 1fr 8px; gap: 6px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.it:hover { background: var(--brand-soft); }
.it.cur { background: var(--card); box-shadow: inset 3px 0 0 var(--brand), 0 1px 3px rgba(0,0,0,.06); color: var(--ink); }
.it .i { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.it .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .dot { margin: 0; }
.it .st { display: flex; gap: 3px; padding-top: 4px; }
.empty-list { color: var(--muted); font-size: 13px; padding: 20px 14px; }

.center { overflow: auto; position: relative; display: flex; flex-direction: column; }
.paper { width: 100%; max-width: 820px; margin: 0 auto; padding: 30px 34px 0; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 600; }
.chip.g { background: #efebe4; color: var(--ink2); font-weight: 500; }
.chip.warn { background: var(--unsure-soft); color: var(--unsure); }
.paper h1 { font: 650 24px/1.34 var(--sans); margin: 10px 0 8px; letter-spacing: -.005em; }
.meta .stamp { margin-left: auto; }
.byline { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kwl { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.6; }
.kwl .sep { color: var(--line2); }
.addnote { margin: 2px 0 14px; font-size: 13px; color: var(--muted); }
.authors { color: var(--ink2); font-size: 14px; }
.venue { color: var(--muted); font-size: 13.5px; font-style: italic; margin-top: 2px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.kw { font-size: 12.5px; padding: 2px 9px; border: 1px solid var(--line2); border-radius: 99px; color: var(--ink2); background: var(--card); }
.abs { font: 17.5px/1.72 var(--serif); color: #2e2821; margin: 18px 0 10px; padding: 22px 26px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.abs .lab { font: 700 11.5px/1 var(--sans); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
.abs.none { color: var(--muted); font-style: italic; }
mark.ev { background: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%); color: inherit; padding: 0 1px; border-radius: 3px; }
mark.ev.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { background: #ffc94d; box-shadow: 0 0 0 3px #ffc94d; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hk { text-decoration: underline 2px var(--keep); text-underline-offset: 4px; }
.hx { text-decoration: underline 2px var(--excl); text-underline-offset: 4px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding: 4px 11px; border-radius: 8px; }
.stamp.k { background: var(--keep-soft); color: var(--keep); } .stamp.x { background: var(--excl-soft); color: var(--excl); }
.note { width: 100%; margin: 6px 0 18px; border: 1px dashed var(--line2); background: transparent; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; resize: vertical; min-height: 38px; }
.note:focus { outline: none; border-style: solid; border-color: var(--brand); background: var(--card); }

.decide { position: sticky; bottom: 0; background: linear-gradient(rgba(246, 242, 234, 0), var(--bg) 26%); padding: 20px 34px 12px; }
.decide .row { max-width: 792px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.big { border: 0; border-radius: 14px; padding: 13px 18px; font-size: 16.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .06s, box-shadow .2s; box-shadow: var(--shadow); }
.big:active { transform: translateY(1px); }
.big.x { background: var(--card); color: var(--excl); border: 2px solid #f0c9c2; }
.big.x:hover, .big.x.sel { background: var(--excl); color: #fff; border-color: var(--excl); }
.big.k { background: var(--keep); color: #fff; border: 2px solid var(--keep); }
.big.k:hover { filter: brightness(1.06); }
.big.k.sel { box-shadow: 0 0 0 4px #bfe3cc; }
.big small { font-weight: 500; opacity: .8; font-size: 13px; }
.reasons { display: flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--muted); overflow-x: auto; scrollbar-width: none; min-width: 0; }
.reasons > span { white-space: nowrap; margin-right: 2px; }
.rc { flex: none; border: 1px solid #f1d8d2; background: var(--card); color: var(--excl); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.rc i { font-style: normal; opacity: .55; margin-right: 3px; font-weight: 500; }
.rc:hover, .rc.sel { background: var(--excl-soft); border-color: var(--excl); }
.rc.sug { box-shadow: 0 0 0 2px var(--ai-soft); border-color: var(--ai); }
.minor { max-width: 792px; margin: 10px auto 0; display: flex; gap: 12px; justify-content: space-between; align-items: center; font-size: 13px; }
.navs { display: flex; gap: 2px; flex: none; }
.ib { border: 0; background: none; width: 32px; height: 30px; border-radius: 8px; color: var(--ink2); font-size: 15px; }
.ib:hover { background: var(--brand-soft); color: var(--brand); }
.ib.on { color: #b7791f; }
.ib:disabled { opacity: .35; cursor: default; background: none; }
.lnk { border: 0; background: none; color: var(--ink2); padding: 4px 6px; border-radius: 7px; }
.lnk:hover { background: var(--brand-soft); color: var(--brand); }
.lnk.on { color: #b7791f; }

.side { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 22px 18px 30px; }
.critbox summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.critbox summary::-webkit-details-marker { display: none; }
.critbox summary h3 { margin: 0; }
.critbox summary .hint::after { content: ' ▾'; }
.critbox[open] summary { margin-bottom: 10px; }
.critbox[open] summary .hint::after { content: ' ▴'; }
.critline { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.ghost.sm { padding: 6px 12px; font-size: 13px; margin-top: 10px; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; z-index: 10; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--ink2); }
.menu button:hover { background: var(--brand-soft); color: var(--brand); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.tb.icon { padding: 6px 12px; font-size: 17px; line-height: 1; }
.finds { padding: 0 14px 10px; display: grid; gap: 6px; }
.finds .search { margin: 0; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
details.more[open] > summary { margin-bottom: 10px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; margin-bottom: 14px; }
.box h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.aibox { border-color: #d8d5f5; }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.verdict .tag { padding: 3px 10px; border-radius: 8px; }
.v-exclude .tag { background: var(--excl-soft); color: var(--excl); }
.v-include .tag { background: var(--keep-soft); color: var(--keep); }
.v-unsure .tag { background: var(--unsure-soft); color: var(--unsure); }
.verdict .code { font-size: 13px; color: var(--ink2); font-weight: 600; }
.why { margin: 10px 0 4px; color: var(--ink); line-height: 1.6; }
.evl { margin: 8px 0 0; padding: 0; list-style: none; }
.evl li { font: 14px/1.5 var(--serif); padding: 7px 10px; margin-top: 6px; background: #fffbea; border-left: 3px solid var(--mark); border-radius: 0 8px 8px 0; cursor: pointer; }
.evl li:hover { background: #fff4c2; }
.evl li.miss { opacity: .6; cursor: default; }
.mutedp { color: var(--muted); font-size: 13.5px; margin: 0; }
.agree { margin-top: 10px; font-size: 12.5px; padding: 6px 9px; border-radius: 8px; }
.agree.no { background: var(--unsure-soft); color: var(--unsure); }
.agree.yes { background: #f0efe9; color: var(--muted); }
.crit { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
.crit li { display: grid; grid-template-columns: 46px 1fr; gap: 6px; padding: 5px 0; border-top: 1px dashed var(--line); }
.crit li:first-child { border-top: 0; }
.crit .c { font-weight: 700; font-size: 12px; padding-top: 2px; }
.crit.ic .c { color: var(--keep); } .crit.ec .c { color: var(--excl); }
.crit .k { color: var(--muted); font-size: 11px; font-weight: 500; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

/* ---------- 开始页 ---------- */
.setup { max-width: 1060px; margin: 0 auto; padding: 46px 28px 60px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { font-size: 32px; margin: 12px 0 8px; letter-spacing: .02em; }
.hero p { color: var(--ink2); margin: 0 auto; max-width: 640px; font-size: 15.5px; }
.steps { display: grid; grid-template-columns: 1fr 1.35fr; gap: 18px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); }
.step.wide { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.step h2 { font-size: 17px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
.num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 14px; flex: none; }
.step p { margin: 0 0 14px; color: var(--ink2); font-size: 14px; }
.drop { text-align: center; border: 2px dashed var(--line2); border-radius: 14px; padding: 20px 14px 16px; color: var(--ink2); transition: .15s; background: var(--panel); }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.drop input { display: none; }
.files { margin-top: 12px; font-size: 13.5px; }
.files div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px dashed var(--line); }
.files div > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files div > span:last-child { flex: none; }
.pickrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.pick { cursor: pointer; }
.herobtns { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
.seg { display: flex; gap: 4px; background: #efe9df; padding: 4px; border-radius: 12px; margin: 6px 0 18px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.pane { min-height: 280px; }
.radios { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.rd { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 400; cursor: pointer; }
.aisum { font-size: 13.5px; color: var(--ink2); margin: 0 0 12px; }
.guide ol { padding-left: 20px; margin: 0 0 14px; line-height: 1.7; font-size: 14px; }
.guide li { margin-bottom: 6px; }
.guide h4 { margin: 16px 0 10px; font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.files .sum { font-weight: 700; color: var(--ink); }
.lab2 { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 13.5px; margin: 10px 0 6px; }
.lab2 .ic { color: var(--keep); } .lab2 .ec { color: var(--excl); }
textarea.ta { width: 100%; min-height: 96px; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; line-height: 1.55; resize: vertical; background: var(--panel); }
textarea.ta:focus, input.in:focus, select.in:focus { outline: none; border-color: var(--brand); background: var(--card); }
input.in, select.in { width: 100%; border: 1px solid var(--line2); border-radius: 9px; padding: 8px 10px; font-size: 13.5px; background: var(--panel); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.primary { border: 0; background: var(--brand); color: #fff; padding: 12px 22px; border-radius: 12px; font-weight: 700; font-size: 15.5px; box-shadow: var(--shadow); white-space: nowrap; }
.primary:disabled { background: var(--line2); cursor: not-allowed; box-shadow: none; }
.primary.ai { background: var(--ai); }
.ghost { border: 1px solid var(--line2); background: var(--card); padding: 8px 14px; border-radius: 10px; font-size: 13.5px; white-space: nowrap; }
.ghost:hover { border-color: var(--brand); color: var(--brand); }
.foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }

/* ---------- 弹窗 ---------- */
.mask { position: fixed; inset: 0; background: rgba(40, 30, 20, .32); display: grid; place-items: center; z-index: 20; padding: 20px; }
.modal { background: var(--panel); border-radius: 18px; box-shadow: 0 20px 60px rgba(40, 30, 20, .25); width: min(680px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 24px 26px; }
.modal h2 { margin: 0 0 4px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal .x { border: 0; background: none; font-size: 22px; color: var(--muted); line-height: 1; }
.modal .sub { color: var(--ink2); font-size: 13.5px; margin: 0 0 16px; }
.fld { margin-bottom: 12px; }
.fld label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
.fld .hint { margin-top: 4px; }
.privacy { background: var(--ai-soft); color: #39338a; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin: 4px 0 14px; }
.est { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.est b { color: var(--ink); }
.actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: 14px; }
details.pp summary { cursor: pointer; font-size: 13px; color: var(--ink2); }
details.pp pre { white-space: pre-wrap; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 240px; overflow: auto; }
.ex-grid { display: grid; gap: 10px; }
.ex { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; }
.ex b { display: block; } .ex span { color: var(--muted); font-size: 13px; }
.ex > :last-child { flex: none; }   /* 说明文字再长，右边的按钮也不被挤成两行 */
pre.prisma { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 13.5px/1.7 var(--sans); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; align-items: center; }
.keys kbd { opacity: 1; margin: 0; justify-self: start; }
.duprow { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.duprow span { color: var(--muted); font-size: 12.5px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 30; box-shadow: var(--shadow); }

@media (max-width: 1180px) { .main { grid-template-columns: 250px minmax(0, 1fr) 300px; } .paper { padding: 22px 24px 0; } .decide { padding: 18px 24px 14px; } }
@media (max-width: 960px) {
  .shell { height: auto; } .main { grid-template-columns: 1fr; } .list { max-height: 260px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side { border-left: 0; } .steps { grid-template-columns: 1fr; } .step.wide { flex-direction: column; align-items: stretch; }
  .top { flex-wrap: wrap; } .prog { order: 3; flex-basis: 100%; max-width: none; }
}

/* ---------- 多人筛选 ---------- */
.dot.c { background: var(--unsure); }
.stamp.c { background: var(--unsure-soft); color: var(--unsure); }
.stamp.g { background: #efebe4; color: var(--ink2); font-weight: 600; }
.seg.mini { margin: 0; padding: 3px; flex: none; }
.seg.mini button { flex: none; padding: 5px 12px; font-size: 13px; }
.ridchip { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }

.rclist { display: grid; gap: 6px; margin-top: 8px; }
.rclist label { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }

/* ---------- 图表 ---------- */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px; }
.chcard .chh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.chcard .chh b { font-size: 14px; }
.chcard .chh b .code { color: var(--bc); }
.chcard .svgw { overflow: auto; }
.chcard svg { display: block; max-width: 100%; height: auto; }
.chcard .actions { margin-top: 6px; }
.chcard.wide { grid-column: 1 / -1; }

/* ---------- 两人编码 ---------- */
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start; }
.atab { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.atab th { text-align: left; font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-weight: 650; padding: 9px 12px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
.atab td { padding: 7px 12px; border-top: 1px dashed var(--line); }
.atab td.cnum { font-variant-numeric: tabular-nums; text-align: right; }
.atab th.cnum { text-align: right; }
.atab tr.low td { background: #fff6e8; }
.atab .code { font-weight: 750; color: var(--bc); }
.pct { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.pct .mbar { width: 60px; margin: 0; }
.pct .mbar i { background: var(--keep); }
.drows { display: grid; gap: 0; }
.dr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13px; cursor: pointer; }
.dr:hover { background: #fbf7f0; }
.dr b { font-size: 12.5px; }
.dr .vs { color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.dr .vs i { font-style: normal; font-weight: 700; color: var(--brand); }
.dr .stamp { padding: 2px 8px; font-size: 12px; }
.sumline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); margin: 0 0 12px; }
.sumline b { color: var(--ink); font-size: 18px; }

/* ---------- 弹窗里的列表 ---------- */
.modal.wide { width: min(860px, 100%); }
.blist { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-top: 8px; }
.blist div { display: grid; grid-template-columns: 28px 112px 1fr; gap: 8px; padding: 6px 10px; border-top: 1px dashed var(--line); font-size: 13px; }
.blist div:first-child { border-top: 0; }
.blist .i { color: var(--muted); font-variant-numeric: tabular-nums; }
.blist b { font-weight: 650; font-size: 12.5px; }
.blist span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seedrow { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: end; }
.seedrow .two { display: flex; gap: 8px; }
.errs { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
.errs li { padding: 4px 0 4px 20px; position: relative; }
.errs li::before { position: absolute; left: 2px; top: 4px; font-weight: 800; }
.errs li.e { color: var(--excl); } .errs li.e::before { content: '✕'; }
.errs li.w { color: var(--unsure); } .errs li.w::before { content: '!'; left: 6px; }
.errs li.o { color: var(--keep); } .errs li.o::before { content: '✓'; }
.prev31 { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow: auto; margin-top: 8px; }
.prev31 svg { display: block; max-width: 100%; height: auto; }
.exrow2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.exrow2 .seg { margin: 0; padding: 3px; }
.exrow2 .seg button { padding: 4px 10px; font-size: 12.5px; }
.cbsum { margin-top: 12px; font-size: 13.5px; }
.cbsum .bl { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px dashed var(--line); }
.cbsum .bl i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.cbsum .bl span:last-child { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.exmenu { position: relative; display: inline-block; }
.exmenu .menu { left: 0; right: auto; min-width: 220px; }
.ex .acts2 { display: flex; gap: 8px; flex: none; align-items: center; }

@media (max-width: 1180px) { .main.ft.cd { grid-template-columns: 230px minmax(0, 1fr) 380px; } .cbgrid, .vgrid, .tgrid { grid-template-columns: 1fr; } .cards4 { grid-template-columns: repeat(2, 1fr); } .charts { grid-template-columns: 1fr; } }

/* ================= 保存（localStorage 放设置，IndexedDB 放记录、PDF 和进度） ================= */
const LS = 'data-coder:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* 存储满了或被禁用 */ } },
  del(k) { try { localStorage.removeItem(LS + k); } catch (e) { /* 忽略 */ } },
};
// PDF 是二进制，localStorage 放不下；IndexedDB 用不了时退回 localStorage，PDF 就只在本次打开时有效
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
    const r = indexedDB.open('data-coder', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const tx = db.transaction('kv', mode); const q = fn(tx.objectStore('kv'));
    tx.oncomplete = () => res(q ? q.result : undefined); tx.onerror = () => rej(tx.error);
  }));
  return {
    ok: true,
    async get(k) { try { return await run('readonly', s => s.get(k)); } catch (e) { DB.ok = false; return store.get('db:' + k, undefined); } },
    async set(k, v) { try { await run('readwrite', s => s.put(v, k)); } catch (e) { DB.ok = false; if (!(v instanceof Blob)) store.set('db:' + k, v); } },
    async del(k) { try { await run('readwrite', s => s.delete(k)); } catch (e) { store.del('db:' + k); } },
  };
})();

/* ================= bib 解析（和前两期的工具同一套，去重结果一致） ================= */
const ACC = { '"': '̈', "'": '́', '`': '̀', '^': '̂', '~': '̃', '=': '̄', '.': '̇', u: '̆', v: '̌', H: '̋', c: '̧', k: '̨', r: '̊' };

    .replace(/\{\\([."'`^~=uvHckr])\s*\{?([A-Za-z])\}?\}/g, (m, a, c) => (c + ACC[a]).normalize('NFC'))

function parseFields(s) {

  while (i < n) {
    while (i < n && /[\s,]/.test(s[i])) i++;

    const name = s.slice(i, j).toLowerCase(); i = j;
    while (i < n && /\s/.test(s[i])) i++;
    if (s[i] !== '=') continue;
    i++;

      while (i < n && /\s/.test(s[i])) i++;
      if (s[i] === '{') {
        let d = 0, k = i;
        for (; k < n; k++) { if (s[k] === '\\') { k++; continue; } if (s[k] === '{') d++; else if (s[k] === '}' && --d === 0) break; }
        val += s.slice(i + 1, k); i = k + 1;
      } else if (s[i] === '"') {
        let d = 0, k = i + 1;
        for (; k < n; k++) { if (s[k] === '\\') { k++; continue; } if (s[k] === '{') d++; else if (s[k] === '}') d--; else if (s[k] === '"' && d === 0) break; }
        val += s.slice(i + 1, k); i = k + 1;
      } else {
        let k = i; while (k < n && /[^,\s#}]/.test(s[k])) k++;
        val += s.slice(i, k); i = k;
      }
      while (i < n && /\s/.test(s[i])) i++;

    }

}
function parseBib(text, file) {
  const out = []; const n = text.length; let i = 0;
  for (;;) {
    const at = text.indexOf('@', i); if (at < 0) break;
    let j = at + 1; while (j < n && /[A-Za-z]/.test(text[j])) j++;
    const type = text.slice(at + 1, j).toLowerCase();
    while (j < n && /\s/.test(text[j])) j++;
    if (!type || text[j] !== '{') { i = at + 1; continue; }
    let d = 0, k = j;
    for (; k < n; k++) { if (text[k] === '\\') { k++; continue; } if (text[k] === '{') d++; else if (text[k] === '}' && --d === 0) break; }
    const body = text.slice(j + 1, k); const raw = text.slice(at, k + 1); i = k + 1;
    if (['comment', 'string', 'preamble'].includes(type)) continue;
    const c = body.indexOf(','); if (c < 0) continue;
    const key = body.slice(0, c).trim();
    const f = parseFields(body.slice(c + 1));
    const authors = clean(f.author).split(/\s+and\s+/i).filter(Boolean).map(a => {
      if (!a.includes(',')) return a.trim();
      const [last, ...rest] = a.split(','); return (rest.join(',').trim() + ' ' + last.trim()).trim();
    });

      key, type, file, raw, uid: file + ':' + key,
      title: clean(f.title), abstract: clean(f.abstract), authors,
      venue: clean(f.journal || f.booktitle || f.series || f.publisher || ''),
      year: (clean(f.year).match(/\d{4}/) || [''])[0],

const normT = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9一-鿿]/g, '');

const baseUid = u => { const i = u.indexOf(':'); return i < 0 ? u : base(u.slice(0, i)) + u.slice(i); };

function shortVenue(r) {

  const b = r.venue.match(/\(([A-Z][A-Za-z&@\-]{1,12})\)\s*$/);
  return b ? b[1] : r.venue;
}

/* ================= 全文筛选的进度备份：取最终纳入的 ================= */
// 进度备份里的编号形如“文件名:引用键”；按文件名（不带路径）+ 引用键对上，换了文件夹也能对上
function ftDecisions() {
  const p = S.ft, toMine = {};
  S.all.forEach(r => r.uids.forEach(u => { toMine[baseUid(u)] = r.id; }));
  const conv = obj => { const o = {}; let hit = 0; for (const [k, v] of Object.entries(obj || {})) { const id = toMine[baseUid(k)]; if (id) { o[id] = v; hit++; } } return [o, hit]; };
  const [dec, hit] = conv(p.dec), [final] = conv(p.final), [note] = conv(p.note);
  const others = Object.values(p.others || {}).map(o => conv(o.dec)[0]);
  const out = {}; let unres = 0;
  new Set([...Object.keys(dec), ...others.flatMap(o => Object.keys(o))]).forEach(id => {
    if (others.length) {           // 多人筛选：按统一后的最终结果
      if (final[id]) { out[id] = final[id].d; return; }
      const ds = [dec[id], ...others.map(o => o[id])];
      if (ds.every(Boolean) && new Set(ds.map(d => d.d)).size === 1) out[id] = ds[0].d; else unres++;
    } else if (dec[id]) out[id] = dec[id].d;
  });
  return { out, hit, total: Object.keys(p.dec || {}).length, note, unres };
}

/* ================= 记录 ================= */
function rebuild() {
  const allRecs = S.files.flatMap(f => f.recs);
  const byDoi = new Map(), byTitle = new Map(), kept = [], dups = [];
  for (const r0 of allRecs) {
    const r = Object.assign({}, r0, { files: [r0.file], uids: [r0.uid] });
    const tk = normT(r.title) + '|' + r.year;
    const hit = (r.doi && byDoi.get(r.doi)) || (normT(r.title).length > 12 && byTitle.get(tk));
    if (hit) {
      dups.push({ title: r.title, a: hit.files[0] + ' · ' + hit.key, b: r.file + ' · ' + r.key });
      const files = [...new Set([...hit.files, r.file])], uids = [...hit.uids, r.uid];
      // 留信息更全的那一份：先比摘要，摘要一样长再比关键词（IEEE 的导出带主题词，更全）
      if (((r.abstract || '').length - (hit.abstract || '').length || r.keywords.length - hit.keywords.length) > 0) Object.assign(hit, r);
      hit.files = files; hit.uids = uids;
      continue;
    }
    kept.push(r); if (r.doi) byDoi.set(r.doi, r); byTitle.set(tk, r);
  }
  kept.forEach(r => {
    r.id = [...r.uids].sort()[0]; r.mk = r.doi ? 'doi:' + r.doi : 't:' + normT(r.title) + '|' + r.year;
    r.keys = r.uids.map(u => u.split(':').slice(1).join(':')); r.short = shortVenue(r);
  });
  S.all = kept; S.dups = dups; S.ftinfo = null;
  let cands = kept;
  if (S.ft) {
    const R = ftDecisions();
    const ok = R.total && R.hit >= Math.max(1, 0.9 * Math.min(R.total, kept.length));
    if (ok) {
      const cnt = d => kept.filter(r => R.out[r.id] === d).length;
      cands = kept.filter(r => R.out[r.id] === 'incl');
      cands.forEach(r => { r.ftNote = R.note[r.id] || ''; });
      S.ftinfo = { ok: true, hit: R.hit, incl: cands.length, excl: cnt('excl'), nr: cnt('nr'), unres: R.unres };
    } else { S.ftinfo = { ok: false, hit: R.hit }; cands = []; }
  }
  S.records = cands; S.byMk = Object.fromEntries(cands.map(r => [r.mk, r]));
  if (S.cur >= S.records.length) S.cur = 0;
}

/* ================= 编码表：项、编号、签名、对比 ================= */
const uid = p => (p || 'i') + Math.random().toString(36).slice(2, 9);
const BCOL = ['#857a6e', '#3d6fa8', '#3f8a5a', '#c0702a', '#7a5aa8', '#2a8a8a', '#b0453c', '#8a6d1f'];
const TYPES = ['single', 'multi', 'text', 'num'];
const SYM = { single: '❍', multi: '❏', text: '[...]', num: '#' };
const OTHER = '__other';
function newItem(block, patch) {
  return Object.assign({ id: uid('i'), block, name: '', type: 'single', opts: [], other: false, nr: false, optional: false, src: '', def: '', how: '', ex: '', chart: { kind: '', with: '' } }, patch || {});
}
function newBlock(kind, patch) {
  const n = S.cb.blocks.length;
  return Object.assign({ id: uid('b'), kind, name: '', rq: '', color: BCOL[Math.min(n, BCOL.length - 1)], answer: '' }, patch || {});
}
// 补齐缺的字段（旧数据、导入的数据都过一遍）
function normCb(cb) {
  cb = Object.assign(emptyCb(), cb || {});
  cb.blocks = (cb.blocks || []).map((b, i) => Object.assign({ id: uid('b'), kind: i ? 'rq' : 'base', name: '', rq: '', color: BCOL[Math.min(i, BCOL.length - 1)], answer: '' }, b));
  cb.items = (cb.items || []).map(it => {
    const x = Object.assign(newItem(it.block), it);
    x.opts = (x.opts || []).map(o => Object.assign({ id: uid('o'), label: '', desc: '' }, o));
    x.chart = Object.assign({ kind: '', with: '' }, x.chart || {});
    if (!TYPES.includes(x.type)) x.type = 'single';

  });

}
const blockOf = (id, cb = S.cb) => cb.blocks.find(b => b.id === id);
const itemById = (id, cb = S.cb) => cb.items.find(i => i.id === id);
// 按块的顺序排好的项；没有分块的放最后
function ordered(cb = S.cb) {
  const out = [];
  cb.blocks.forEach(b => cb.items.forEach(i => { if (i.block === b.id) out.push(i); }));
  cb.items.forEach(i => { if (!blockOf(i.block, cb)) out.push(i); });
  return out;
}
// 编号 C1…Cn：跟着顺序走，挪动以后自动重排
function codeMap(cb = S.cb) { const m = {}; ordered(cb).forEach((it, k) => { m[it.id] = 'C' + (k + 1); }); return m; }

const refreshCodes = () => { CODES = codeMap(); };
const cname = (it, codes = CODES) => (codes[it.id] || '') + ' ' + (it.name || t('noName'));
const isChoice = it => it.type === 'single' || it.type === 'multi';
const optLabel = (it, oid) => (oid === OTHER ? t('other') : (it.opts.find(o => o.id === oid)?.label || t('goneOpt')));

function itemSig(it) {
  return hash(JSON.stringify([it.type, it.opts.map(o => [o.id, o.label, o.desc || '']), !!it.other, !!it.nr, it.def || '', it.how || '', it.ex || '']));
}
const latest = () => S.versions[S.versions.length - 1] || null;

// 两版编码表逐项对比（按内部编号对，不按名字）
function diffCb(a, b) {
  const out = [], ca = codeMap(a), cbm = codeMap(b);
  const nm = (it, codes) => (codes[it.id] || '') + ' ' + it.name;
  a.blocks.forEach(x => { if (!blockOf(x.id, b)) out.push({ k: 'delBlock', s: '−', c: 'del', txt: t('dDelBlock', x.name) }); });
  b.blocks.forEach(y => {
    const x = blockOf(y.id, a);
    if (!x) { out.push({ k: 'addBlock', s: '+', c: 'add', txt: t('dAddBlock', y.name) }); return; }
    if (x.name !== y.name) out.push({ k: 'renBlock', s: '~', c: 'chg', txt: t('dRenBlock', x.name, y.name) });
    if ((x.rq || '') !== (y.rq || '')) out.push({ k: 'rq', s: '~', c: 'chg', txt: t('dRq', y.name) });
  });
  ordered(a).forEach(x => { if (!itemById(x.id, b)) out.push({ k: 'delItem', s: '−', c: 'del', id: x.id, txt: t('dDelItem', x.name, ca[x.id]) }); });
  ordered(b).forEach(y => {
    const x = itemById(y.id, a), N = nm(y, cbm);
    if (!x) { out.push({ k: 'addItem', s: '+', c: 'add', id: y.id, txt: t('dAddItem', N) }); return; }
    const push = (k, c, txt, opt) => out.push({ k, s: c === 'add' ? '+' : c === 'del' ? '−' : '~', c, id: y.id, txt, opt });
    if (x.name !== y.name) push('renItem', 'chg', t('dRenItem', ca[x.id] + ' ' + x.name, N));
    if (x.type !== y.type) push('type', 'chg', t('dType', N, t('ty_' + x.type), t('ty_' + y.type)));
    if (x.block !== y.block) push('move', 'chg', t('dMove', N, blockOf(y.block, b)?.name || '—'));
    y.opts.forEach(o => { const p = x.opts.find(q => q.id === o.id); if (!p) push('addOpt', 'add', t('dAddOpt', N, o.label), o.label); else {
      if (p.label !== o.label) push('renOpt', 'chg', t('dRenOpt', N, p.label, o.label));
      if ((p.desc || '') !== (o.desc || '')) push('optDesc', 'chg', t('dOptDesc', N, o.label)); } });
    x.opts.forEach(p => { if (!y.opts.some(o => o.id === p.id)) push('delOpt', 'del', t('dDelOpt', N, p.label)); });
    if (!!x.other !== !!y.other) push('other', y.other ? 'add' : 'del', t(y.other ? 'dOtherOn' : 'dOtherOff', N));
    if (!!x.nr !== !!y.nr) push('nr', y.nr ? 'add' : 'del', t(y.nr ? 'dNrOn' : 'dNrOff', N));
    const ins = ['def', 'how', 'ex'].filter(k => (x[k] || '') !== (y[k] || ''));
    if (ins.length) push('instr', 'chg', t('dInstr', N, ins.map(k => t('f_' + k)).join(isZh() ? '、' : ', ')));
    if (!!x.optional !== !!y.optional) push('optional', 'mnr', t('dOptional', N));

}
// 改动的一句话总结（写进版本记录和 3.4 的段落）
function diffSummary(ch, lang = LANG, list = false) {   // list：返回一句一句的数组（写 3.4 段落用）
  const z = lang === 'zh', sep = z ? '；' : '; ';
  const L = (k, ...a) => { let s = I18N[lang][k] ?? I18N.zh[k]; a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); }); return s; };
  const names = ks => ch.filter(c => ks.includes(c.k));
  const parts = [];
  const add = names(['addItem']), del = names(['delItem']), opt = names(['addOpt']), ins = names(['instr', 'optDesc']);
  if (opt.length) {
    const g = {}; opt.forEach(c => { (g[c.id] = g[c.id] || []).push(c.opt); });
    Object.entries(g).forEach(([id, os]) => parts.push(L('sumOpt', itemName(id), os.map(o => z ? `“${o}”` : `"${o}"`).join(z ? '' : ', '), os.length)));
  }
  if (add.length) parts.push(L('sumAdd', add.map(c => itemName(c.id)).join(z ? '、' : ', '), add.length));
  if (del.length) parts.push(L('sumDel', del.map(c => itemName(c.id)).join(z ? '、' : ', '), del.length));
  if (ins.length) parts.push(L('sumInstr', [...new Set(ins.map(c => itemName(c.id)))].join(z ? '、' : ', ')));
  const other = ch.filter(c => !['addItem', 'delItem', 'addOpt', 'instr', 'optDesc', 'chart', 'optional'].includes(c.k));

}
function itemName(id) { for (const cb of [S.cb, ...S.versions.map(v => v.cb).reverse()]) { const it = itemById(id, cb); if (it) return it.name; } return '?'; }
const isDirty = () => !latest() || diffCb(latest().cb, S.cb).length > 0;

function chartLabel(it, cb = S.cb) {

/* ================= 编码：每篇每项一个格子 ================= */
// 格子：{ v 值, o “其他”的文字, nr 未报告, ev 证据, fl 疑点, sig 编的时候这一项的签名, auto 从 bib 带入 }
const cellOf = (mk, id) => S.code[mk]?.c?.[id];
const answered = c => !!c && (!!c.nr || (Array.isArray(c.v) ? c.v.length > 0 : String(c.v ?? '').trim() !== ''));

function paperStatus(mk) {
  if (!started(mk)) return 'todo';
  return ordered().filter(i => !i.optional).every(i => answered(cellOf(mk, i.id))) ? 'done' : 'part';
}
function setCell(mk, id, patch) {
  const it = itemById(id); if (!it) return;
  const P = S.code[mk] || (S.code[mk] = { c: {} });
  const c = Object.assign({}, P.c[id] || {}, patch);
  if ('v' in patch || 'nr' in patch || 'o' in patch) { c.sig = itemSig(it); delete c.auto; clearRecode(mk, id); }
  Object.keys(c).forEach(k => { if (c[k] === '' || c[k] == null || c[k] === 0 || (Array.isArray(c[k]) && !c[k].length && k !== 'v')) delete c[k]; });

}
// 从 bib 带入的值（年份、出处、文献类型）：格子空着时自动填上，标“来自 bib”
function autoFill(mk) {
  const r = S.byMk[mk]; if (!r) return;
  ordered().forEach(it => {
    if (!it.src || answered(cellOf(mk, it.id))) return;
    let v = '';
    if (it.src === 'year') v = r.year;
    else if (it.src === 'venue') v = r.short || r.venue;
    else if (it.src === 'btype' && isChoice(it)) {
      const conf = /proceedings|conference|inproceedings/i.test(r.type), want = conf ? /会议|conference|proceeding/i : /期刊|journal|article/i;
      const o = it.opts.find(x => want.test(x.label)); if (o) v = it.type === 'multi' ? [o.id] : o.id;
    }
    if (!v || (Array.isArray(v) && !v.length)) return;
    const P = S.code[mk] || (S.code[mk] = { c: {} });
    P.c[it.id] = Object.assign({}, P.c[it.id] || {}, { v, auto: 1, sig: itemSig(it) });
  });
}
const recodeOf = mk => (S.recode[mk] || []).filter(id => itemById(id));
function clearRecode(mk, id) { const a = S.recode[mk]; if (!a) return; const b = a.filter(x => x !== id); if (b.length) S.recode[mk] = b; else delete S.recode[mk]; }
function stats() {
  let done = 0, part = 0, rc = 0;
  S.records.forEach(r => { const s = paperStatus(r.mk); if (s === 'done') done++; else if (s === 'part') part++; if (recodeOf(r.mk).length) rc++; });
  return { n: S.records.length, done, part, todo: S.records.length - done - part, rc };
}
// 格子显示成文字（导出、图表、两人对比都用）
function cellText(it, c, lang = LANG) {
  if (!c) return '';
  if (c.nr) return lang === 'zh' ? '未报告' : 'not reported';
  if (it.type === 'single') return c.v === OTHER ? (lang === 'zh' ? '其他' : 'Other') + (c.o ? (lang === 'zh' ? '：' : ': ') + c.o : '') : (c.v ? optLabel(it, c.v) : '');
  if (it.type === 'multi') return (c.v || []).map(v => v === OTHER ? (lang === 'zh' ? '其他' : 'Other') + (c.o ? (lang === 'zh' ? '：' : ': ') + c.o : '') : optLabel(it, v)).join('; ');
  return String(c.v ?? '');

/* ================= 定版 ================= */
// 已经编过的文献里，哪些项和新版本对不上：编的时候这一项的说明不一样（签名变了），或者这一项是新加的
function freezeCands() {
  const prev = latest(), out = [];
  const mks = S.records.filter(r => started(r.mk)).map(r => r.mk);
  ordered().forEach(it => {
    const sig = itemSig(it), isNew = !!prev && !itemById(it.id, prev.cb);
    const hit = mks.filter(mk => { const c = cellOf(mk, it.id); if (!c || c.auto || !answered(c)) return isNew; return c.sig !== sig; });
    if (hit.length) out.push({ id: it.id, mks: hit, isNew });
  });
  return out;
}
function doFreeze(reason, recodeIds) {
  const v = S.versions.length + 1, prev = latest();
  const changes = prev ? diffCb(prev.cb, S.cb) : [];
  const papers = new Set();
  freezeCands().forEach(c => {
    if (recodeIds.includes(c.id)) c.mks.forEach(mk => { S.recode[mk] = [...new Set([...(S.recode[mk] || []), c.id])]; papers.add(mk); });
    else c.mks.forEach(mk => { const cell = cellOf(mk, c.id); if (cell) cell.sig = itemSig(itemById(c.id)); });
  });
  S.versions.push({ v, at: Date.now(), reason: String(reason || '').trim(), cb: clone(S.cb), changes, summary: { zh: diffSummary(changes, 'zh'), en: diffSummary(changes, 'en') }, recode: recodeIds, nRecode: papers.size, nItems: S.cb.items.length, nBlocks: S.cb.blocks.length });
  S.records.forEach(r => { if (started(r.mk) && !recodeOf(r.mk).length) S.code[r.mk].ver = 'v' + v; });
  save();
  return papers.size;
}

/* ================= 随机抽一批 ================= */
// 有种子的随机数（mulberry32）：同样的种子、同样的文献，抽出来的一样，种子可以写进方法
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}
const batchOf = mk => S.batches.find(b => b.mks.includes(mk))?.n || 0;
// 能抽的：还没编、也不在试编批次里的；按引用键排好再洗，结果不受导入顺序影响
const drawPool = () => S.records.filter(r => !batchOf(r.mk) && !started(r.mk)).sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
function drawBatch(seed, n) {
  const pool = drawPool(), rnd = mulberry32(seed >>> 0), k = Math.min(n, pool.length);
  for (let i = 0; i < k; i++) { const j = i + Math.floor(rnd() * (pool.length - i)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, k);
}
const newSeed = () => 1 + Math.floor(Math.random() * 2147483646);
const batchName = (n, lang = LANG) => (n ? (lang === 'zh' ? `试编第 ${n} 批` : `Pilot batch ${n}`) : (lang === 'zh' ? '正式编码' : 'Main coding'));

/* ================= 两个人编：一致率 ================= */
const hasTeam = () => multi() && Object.keys(S.others).length > 0;
// 比较用的值：未报告当成一个单独的类别
function vkey(it, c) {
  if (!answered(c)) return null;
  if (c.nr) return '__nr';
  if (it.type === 'multi') return [...(c.v || [])].sort().join('|');
  if (it.type === 'single') return String(c.v);
  return String(c.v).trim().toLowerCase().replace(/\s+/g, ' ');
}
function kappa(pairs) {   // pairs: [[a, b], ...]
  const n = pairs.length; if (!n) return null;
  const pa = {}, pb = {}; let ag = 0;
  pairs.forEach(([a, b]) => { if (a === b) ag++; pa[a] = (pa[a] || 0) + 1; pb[b] = (pb[b] || 0) + 1; });
  const po = ag / n, pe = [...new Set([...Object.keys(pa), ...Object.keys(pb)])].reduce((s, c) => s + ((pa[c] || 0) / n) * ((pb[c] || 0) / n), 0);
  return { n, ag, po, k: pe >= 1 ? (po === 1 ? 1 : 0) : (po - pe) / (1 - pe) };
}
// 一项的一致率：单选算 Cohen's κ；多选按每个选项“选了 / 没选”分别比，再取平均；摘录原文和数字看是否完全一样
function agreeItem(it, A, B) {
  const mks = S.records.map(r => r.mk).filter(mk => answered(A[mk]?.c?.[it.id]) && answered(B[mk]?.c?.[it.id]));
  if (!mks.length) return null;
  const ka = mk => vkey(it, A[mk].c[it.id]), kb = mk => vkey(it, B[mk].c[it.id]);
  const dis = mks.filter(mk => ka(mk) !== kb(mk));
  if (it.type === 'multi') {
    const sel = (c, o) => (o === '__nr' ? !!c.nr : !c.nr && (c.v || []).includes(o));
    const opts = [...it.opts.map(o => o.id), ...(it.other ? [OTHER] : []), '__nr']
      .filter(o => mks.some(mk => sel(A[mk].c[it.id], o) || sel(B[mk].c[it.id], o)));
    const per = opts.map(o => kappa(mks.map(mk => [sel(A[mk].c[it.id], o) ? 1 : 0, sel(B[mk].c[it.id], o) ? 1 : 0])));
    const pct = per.length ? per.reduce((s, x) => s + x.po, 0) / per.length : 1;
    const ks = per.map(x => x.k).filter(x => x != null);
    return { n: mks.length, pct, k: ks.length ? ks.reduce((s, x) => s + x, 0) / ks.length : null, dis, kind: 'multi' };
  }
  if (it.type === 'single') { const k = kappa(mks.map(mk => [ka(mk), kb(mk)])); return { n: mks.length, pct: k.po, k: k.k, dis, kind: 'single' }; }
  return { n: mks.length, pct: (mks.length - dis.length) / mks.length, k: null, dis, kind: it.type };
}
const othersList = () => Object.keys(S.others);
const pairOther = () => (othersList().includes(S.pair) ? S.pair : othersList()[0]);
function agreeAll(rid = pairOther()) {
  const B = S.others[rid]?.code || {};

}
// 有分歧的格子（文献 × 项），和每一位别人比
function disagreements() {
  const out = [];

    const B = S.others[rid].code || {};
    S.records.forEach(r => ordered().forEach(it => {
      const a = S.code[r.mk]?.c?.[it.id], b = B[r.mk]?.c?.[it.id];
      if (answered(a) && answered(b) && vkey(it, a) !== vkey(it, b)) out.push({ mk: r.mk, r, it, rid, a, b, res: S.final[r.mk]?.[it.id] });

}

/* ================= PDF：导入、对上记录、存起来（和全文筛选助手同一套） ================= */
const alnum = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const STOP = new Set('the and for with from into using use how what when why are its our their this that via can does not but'.split(' '));
const words = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w));
// 文件名 → 记录：先看引用键，再看 DOI，最后按题目里的词重合程度
function matchPdf(fname) {
  const stem = fname.replace(/\.pdf$/i, ''), a = alnum(stem), ws = new Set(words(stem));
  for (const r of S.records) if (r.keys.some(k => alnum(k).length >= 4 && a.includes(alnum(k)))) return r;
  for (const r of S.records) { const d = alnum(r.doi.split('/').slice(1).join('/')); if (d.length >= 5 && a.includes(d)) return r; }
  let best = null, s1 = 0, s2 = 0;
  for (const r of S.records) {
    const tw = new Set(words(r.title)); if (!tw.size || !ws.size) continue;
    const hit = [...ws].filter(w => tw.has(w)).length;
    const score = hit < 3 ? 0 : hit / Math.min(tw.size, ws.size);   // 文件名里的词大多出现在题目里
    if (score > s1) { s2 = s1; s1 = score; best = r; } else if (score > s2) s2 = score;
  }
  return s1 >= 0.75 && s1 - s2 >= 0.2 ? best : null;
}
async function addPdfs(list) {
  let n = 0, hit = 0;
  for (const it of list) {
    const f = it.file || it; if (!/\.pdf$/i.test(f.name)) continue;
    n++;
    const r = matchPdf(f.name);
    if (r) { await attachPdf(r.mk, f); hit++; }
    else if (!S.loose.some(x => x.name === f.name)) { S.loose.push({ name: f.name, size: f.size }); BLOBS.set('u:' + f.name, f); await DB.set('u:' + f.name, f); }
  }
  savePdfIndex();
  if (n) toast(t('pdfDone', n, hit));
  refreshAfterPdf();
}

// 拖进来的可能是文件，也可能是文件夹：文件夹逐层读出里面的文件
async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async (entry, path) => {
    if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file: f, path: path + f.name }); return; }
    if (!entry.isDirectory) return;
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const e of batch) await walk(e, path + entry.name + '/');
    }
  };
  for (const e of entries) await walk(e, '');
  return out;
}
async function addRecFiles(list) {
  let n = 0, bak = null;   // 数据编码助手自己的进度备份：等文献都读进来以后再导入
  for (const it of list) {
    const f = it.file || it, name = base(it.path || f.webkitRelativePath || f.name);
    if (/\.pdf$/i.test(f.name)) continue;
    if (/\.json$/i.test(f.name)) {
      n++;
      let p = null; try { p = JSON.parse(await f.text()); } catch (e) { /* 下面提示 */ }
      if (p?.app === 'ft-screener' && p.dec) S.ft = { name, dec: p.dec, final: p.final || {}, others: p.others || {}, note: p.note || {} };
      else if (p?.app === 'data-coder' && p.kind === 'backup') bak = p;
      else toast(t('jsonBad', name));
      continue;
    }
    if (!/\.(bib|bibtex|txt)$/i.test(f.name)) continue;
    n++;
    const text = await f.text(), recs = parseBib(text, name);
    if (!recs.length) { toast(t('parseFail', name)); continue; }
    S.files = S.files.filter(x => x.name !== name).concat([{ name, text, recs }]);
  }
  if (!n && list.length) toast(t('noFile'));
  await afterFilesChanged();
  if (bak && await importBackup(bak)) render();
}

function scopeMks(scope = S.scope) {
  return S.records.filter(r => started(r.mk) && (scope === 'all' || (scope === 'main' ? !batchOf(r.mk) : 'b' + batchOf(r.mk) === scope))).map(r => r.mk);

// 一项在这些文献里的分布：类别 → 篇数（多选一篇可以算进几个类别）
function dist(it, mks) {
  const cnt = new Map(), add = (k, l) => { const x = cnt.get(k) || { k, l, n: 0 }; x.n++; cnt.set(k, x); };
  let nr = 0, empty = 0, other = 0; const otherTxt = {};
  if (isChoice(it)) { it.opts.forEach(o => cnt.set(o.id, { k: o.id, l: o.label, n: 0 })); if (it.other) cnt.set(OTHER, { k: OTHER, l: t('other'), n: 0 }); }
  mks.forEach(mk => {
    const c = finalCell(mk, it.id);
    if (!answered(c)) { empty++; return; }
    if (c.nr) { nr++; return; }
    const vs = it.type === 'multi' ? c.v : [c.v];
    vs.forEach(v => {
      if (isChoice(it)) { add(v, optLabel(it, v)); if (v === OTHER) { other++; const k = String(c.o || '').trim() || '—'; otherTxt[k] = (otherTxt[k] || 0) + 1; } }
      else { const s = String(v).trim(); add(s.toLowerCase(), s); }
    });
  });
  let cats = [...cnt.values()];
  if (it.type === 'num') cats.sort((a, b) => (+a.l) - (+b.l));
  else if (it.type === 'text') cats.sort((a, b) => b.n - a.n);
  return { cats, nr, empty, other, otherTxt, n: mks.length };
}
function runChecks(mks) {
  const its = ordered(), R = { link: [], find: {}, answer: [], chart: [], other: {} };
  S.cb.blocks.forEach(b => {
    if (b.kind !== 'rq') return;
    if (!S.cb.items.some(i => i.block === b.id)) R.link.push({ b: b.id, txt: t('lkNoItems', b.name) });
    if (!String(b.rq || '').trim()) R.link.push({ b: b.id, txt: t('lkNoRq', b.name) });
    if (!String(b.answer || '').trim()) R.answer.push(b.id);
  });
  its.filter(i => !blockOf(i.block)).forEach(i => R.link.push({ i: i.id, txt: t('lkNoBlock', cname(i)) }));
  its.forEach(it => {
    if (!it.chart.kind) R.chart.push({ i: it.id, txt: t('chNone0') });
    else if (it.chart.kind === 'heat' && !itemById(it.chart.with)) R.chart.push({ i: it.id, txt: t('chNoPartner') });
    if (!mks.length) return;
    const d = dist(it, mks), miss = d.nr + d.empty, sh = miss / mks.length;
    R.find[it.id] = { miss, n: mks.length, sh, lvl: it.optional ? 'opt' : sh >= 0.5 ? 'bad' : sh >= 0.3 ? 'warn' : 'ok', nr: d.nr, empty: d.empty };
    const answeredN = mks.length - miss;
    if (it.other && answeredN && d.other / answeredN > 0.25) R.other[it.id] = { n: d.other, of: answeredN, sh: d.other / answeredN, txt: d.otherTxt };
  });
  S.cb.blocks.forEach(b => { if (b.kind === 'rq') { const bi = its.filter(i => i.block === b.id); if (bi.length && bi.every(i => i.chart.kind === 'none')) R.chart.push({ b: b.id, txt: t('chBlockNone', b.name) }); } });
  return R;
}

  S.view = 'checks'; refreshCodes();

  const rqs = S.cb.blocks.filter(b => b.kind === 'rq');
  const findBad = Object.values(R.find).filter(x => x.lvl === 'bad' || x.lvl === 'warn').length;
  const cards = checkCard('link', 0, '', R.link.length ? `⚠︎ ${t('stIssues', R.link.length)}` : `✓ ${t('stLinkOk')}`, R.link.length ? 'warn' : 'ok')

/* ================= 表 3.1：四块并排的编码表概览（照 Hirzle 等 2023 的 Table 2） ================= */
function table31SVG(lang = S.out.lang31) {

  const fs = 14, hfs = 14, pad = 12, lh = 24;
  const cw = cols.map(c => Math.max(150, Math.min(260, Math.max(tw(c.b.name, hfs, 700) + pad * 2, ...c.items.map(i => tw(CODES[i.id] + ' ' + i.name, fs) + pad * 2)))));
  const heads = cols.map((c, k) => wrap(c.b.name, cw[k] - pad * 2, hfs, 700)), hh = Math.max(...heads.map(h => h.length)) * 19 + 16;

  const W = cw.reduce((s, v) => s + v, 0) + 40, capL = wrap(cap, W - 40, 15, 600), top = 20 + capL.length * 21 + 10;

    heads[k].forEach((l, i) => { s += `<text x="${x + pad}" y="${top + 8 + 10 + i * 19}" dominant-baseline="central" font-size="${hfs}" font-weight="700" fill="#fff">${X(l)}</text>`; });
    c.items.forEach((it, i) => { s += `<text x="${x + pad}" y="${top + hh + pad / 2 + i * lh + lh / 2}" dominant-baseline="central" font-size="${fs}" fill="#1d1a16"><tspan font-weight="700">${X(CODES[it.id])}</tspan> ${X(it.name)}</text>`; });
    if (k) s += `<line x1="${x}" y1="${top}" x2="${x}" y2="${top + hh + rowsN * lh + pad}" stroke="#fff" stroke-width="2"/>`;
    x += w;

}

      const seen = new Set(); opts.forEach(op => { if (seen.has(op.label)) W.push(w + t('vDupOpt', op.label)); seen.add(op.label); });
      const chs = str(x.chart).toLowerCase(); let kind = '', withName = '';
      if (/^(bar|条形图|柱状图)/.test(chs)) kind = 'bar'; else if (/^(heat|热力图)/.test(chs)) { kind = 'heat'; withName = str(x.chart).split(/[:：]/).slice(1).join(':').trim(); }
      else if (/^(table|表格|表)/.test(chs)) kind = 'table'; else if (/^(none|不画|无)/.test(chs)) kind = 'none'; else if (chs) W.push(w + t('vChart', str(x.chart)));
      const it = newItem(B.id, { name: nm || '?', type: ty || 'single', opts: ty === 'single' || ty === 'multi' ? opts.map(op => ({ id: uid('o'), label: op.label, desc: op.desc })) : [], other: (ty === 'single' || ty === 'multi') && other, nr, optional: !!x.optional,
        def: str(x.definition || x.def), how: str(x.how || x.decide), ex: str(x.example || x.ex), chart: { kind, with: '' } });

  const names = {}; cb.items.forEach(it => { const k = normName(it.name); if (names[k]) W.push(t('vDupItem', it.name)); names[k] = 1; });

// 换上新的编码表：和现在的草稿、以前的版本按内部编号或名字对上，沿用原来的编号（已编的值、版本对比都接得上）
function adoptCb(nc) {
  const pool = [S.cb, ...S.versions.map(v => v.cb).reverse()], usedI = new Set(), usedB = new Set();
  const find = (kind, x) => { for (const cb of pool) { const arr = kind === 'i' ? cb.items : cb.blocks, used = kind === 'i' ? usedI : usedB;
    const y = arr.find(z => z.id === x.id && !used.has(z.id)) || arr.find(z => !used.has(z.id) && normName(z.name) === normName(x.name))
      || (kind === 'b' && arr.find(z => !used.has(z.id) && (x.name.match(/^RQ\s*\d+/i) || [])[0] && (z.name.match(/^RQ\s*\d+/i) || [])[0] === (x.name.match(/^RQ\s*\d+/i) || [])[0]));
    if (y) return y; } return null; };
  const bmap = {};
  nc.blocks.forEach(b => { const o = find('b', b); if (o) { bmap[b.id] = o.id; usedB.add(o.id); if (!b.answer && o.answer) b.answer = o.answer; b.id = o.id; } else bmap[b.id] = b.id; });
  const imap = {};
  nc.items.forEach(it => {
    it.block = bmap[it.block] || it.block;
    const o = find('i', it); if (!o) { imap[it.id] = it.id; return; }
    usedI.add(o.id); imap[it.id] = o.id; it.id = o.id;
    const usedO = new Set();
    it.opts.forEach(op => { const p = o.opts.find(q => q.id === op.id && !usedO.has(q.id)) || o.opts.find(q => !usedO.has(q.id) && normName(q.label) === normName(op.label)); if (p) { op.id = p.id; usedO.add(p.id); } });
  });
  nc.items.forEach(it => { if (it.chart.with) it.chart.with = imap[it.chart.with] || it.chart.with; });
  // 块的“可能的答案”：新的没写，就留着原来的
  S.cb = normCb(nc); refreshCodes(); save();
}

  LANG = v; store.set('lang', LANG); document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  render(); if (modalKind) openModal(modalKind);
}
function bindModal(kind) {
  if (kind === 'settings' && (S.setTab || 'files') === 'lang') document.querySelectorAll('input[name=ui]').forEach(r => { r.onchange = () => setLang(r.value); });
  if (kind === 'batch') {
    const upd = () => { modalData.size = $('#bSize').value; modalData.seed = $('#bSeed').value; $('#batchList').outerHTML = batchPreview(); };
    $('#bSize').oninput = upd; $('#bSeed').oninput = upd;
  }
  if (kind === 'ai') {
    const upd = () => { Object.assign(modalData, { field: $('#aiField').value, rqs: $('#aiRqs').value, notes: $('#aiNotes').value }); S.cb.field = modalData.field; S.cb.notes = modalData.notes; save(); $('#aiPrompt').textContent = aiPrompt(modalData); };
    ['#aiField', '#aiRqs', '#aiNotes'].forEach(s => { $(s).oninput = upd; });
  }
  if (kind === 'paste') { const box = $('#pasteBox'); box.oninput = () => { modalData.text = box.value; $('#pasteRes').innerHTML = pasteResHTML(); }; box.focus(); }
  if (kind === 'export') {
    $('#impJson').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { if (await importBackup(JSON.parse(await f.text()))) { closeModal(); render(); } } catch (err) { toast(t('impBad')); } };
    document.querySelectorAll('[data-onum]').forEach(inp => { inp.oninput = () => { S.out[inp.dataset.onum] = inp.value.trim() || (inp.dataset.onum === 'app' ? 'A' : '3.1'); saveOut(); $('#prev31').innerHTML = table31SVG(); }; });
  }
}
const fileTag = lang => (lang === 'zh' ? '' : '_en');
function loadExample(stage) {
  const has = S.cb.items.length;
  if (has && !confirm(t('exConfirm'))) return;
  adoptCb(exampleCb(stage, LANG));
  S.sel = ''; toast(t('exLoaded', t('exV' + stage)));
  if (S.view === 'setup') renderSetup(); else go2('codebook');
}
function startBlank() {
  const b0 = newBlock('base', { name: t('baseName') }); S.cb.blocks.push(b0);
  const b1 = newBlock('rq', { name: 'RQ1' }); S.cb.blocks.push(b1);
  S.cb.items.push(newItem(b0.id, { name: t('yearName'), type: 'num', src: 'year', chart: { kind: 'bar', with: '' } }));
  S.sel = 'b:' + b1.id; save(); go2('codebook');
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  // 点在下拉菜单外面就收起来
  const inWrap = e.target.closest('.menu-wrap');
  document.querySelectorAll('.menu').forEach(m => { if (!inWrap || !inWrap.contains(m)) m.classList.add('hidden'); });
  const b = e.target.closest('[data-act],[data-view],[data-filter],[data-go],[data-tab],[data-ex],[data-selb],[data-item],[data-additem],[data-bmove],[data-imove],[data-ty],[data-oup],[data-odel],[data-chk],[data-col],[data-pill],[data-cnr],[data-cev],[data-cfl],[data-cinfo],[data-cok],[data-res],[data-goitem],[data-recgo],[data-restore],[data-delbatch],[data-disgo],[data-dlchart],[data-l34],[data-olang]');
  if (!b) return;
  const d = b.dataset;
  if (b.closest('.menu') && !d.act?.endsWith('Menu')) b.closest('.menu').classList.add('hidden');
  if (d.view) { e.preventDefault(); go2(d.view); return; }
  if (d.tab) { S.setTab = d.tab; openModal('settings'); return; }
  if (d.ex) { loadExample(+d.ex); return; }
  if (d.l34) { S.out.lang34 = d.l34; saveOut(); openModal('s34'); return; }
  if (d.olang) { S.out[d.olang] = d.v; saveOut(); openModal('export'); return; }
  // 编码表
  if (d.selb) { if (e.target.closest('[data-bmove]')) return; S.sel = 'b:' + d.selb; renderCodebook(); return; }
  if (d.bmove) { const i = S.cb.blocks.findIndex(x => x.id === d.b), j = i + +d.bmove; if (j >= 0 && j < S.cb.blocks.length) { [S.cb.blocks[i], S.cb.blocks[j]] = [S.cb.blocks[j], S.cb.blocks[i]]; cbChanged(true); } return; }
  if (d.item && b.classList.contains('irow')) { S.sel = d.item; renderCodebook(); return; }
  if (d.goitem) { e.preventDefault(); S.sel = d.goitem; go2('codebook'); return; }
  if (d.additem) { const it = newItem(d.additem, { name: '' }); S.cb.items.push(it); moveItem(it.id, d.additem, null); S.sel = it.id; cbChanged(true); $('#editor [data-f=name]')?.focus(); return; }
  if (d.imove) { stepItem(S.sel, +d.imove); cbChanged(true); return; }
  if (d.ty) { const it = itemById(S.sel); it.type = d.ty; if (!isChoice(it)) it.other = false; cbChanged(true); return; }
  if (d.oup) { const it = itemById(S.sel), i = it.opts.findIndex(o => o.id === d.oup); if (i > 0) { [it.opts[i - 1], it.opts[i]] = [it.opts[i], it.opts[i - 1]]; cbChanged(true); } return; }
  if (d.odel) { const it = itemById(S.sel); it.opts = it.opts.filter(o => o.id !== d.odel); cbChanged(true); return; }
  if (d.chk) { const it = itemById(S.sel); it.chart = { kind: d.chk, with: d.chk === 'heat' ? it.chart.with : '' }; cbChanged(true); return; }
  if (d.col) { const bl = blockOf(S.sel.slice(2)); bl.color = d.col; cbChanged(true); return; }
  // 编码
  const r = S.records[S.cur];
  if (d.pill) {
    e.preventDefault();
    const it = itemById(d.pill), c = cellOf(r.mk, it.id) || {}, v = d.v;
    if (it.type === 'single') setCell(r.mk, it.id, { v: c.v === v ? '' : v, nr: 0 });
    else { const cur = Array.isArray(c.v) ? c.v : []; setCell(r.mk, it.id, { v: cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v], nr: 0 }); }
    afterCell(it.id, true); if (v === OTHER) $(`[data-co="${it.id}"]`)?.focus(); return;
  }
  if (d.cnr) { const c = cellOf(r.mk, d.cnr); setCell(r.mk, d.cnr, c?.nr ? { nr: 0 } : { nr: 1, v: '', o: '' }); afterCell(d.cnr, true); return; }
  if (d.cev) { const k = r.mk + '|' + d.cev; S.openEv[k] = !S.openEv[k]; afterCell(d.cev, true); if (S.openEv[k]) $(`[data-cevt="${d.cev}"]`)?.focus(); return; }
  if (d.cfl) { const c = cellOf(r.mk, d.cfl); setCell(r.mk, d.cfl, { fl: c?.fl ? 0 : 1 }); afterCell(d.cfl, true); return; }
  if (d.cinfo) { S.openEv['i' + d.cinfo] = !S.openEv['i' + d.cinfo]; afterCell(d.cinfo, true); return; }
  if (d.cok) { const c = cellOf(r.mk, d.cok); if (c) c.sig = itemSig(itemById(d.cok)); clearRecode(r.mk, d.cok); if (!recodeOf(r.mk).length) S.code[r.mk].ver = verLabel(); save(); afterCell(d.cok, true); return; }
  if (d.res) { const it = itemById(d.res), src = d.rv ? S.others[d.rv].code[r.mk].c[it.id] : cellOf(r.mk, it.id); (S.final[r.mk] = S.final[r.mk] || {})[it.id] = { v: clone(src.v ?? ''), o: src.o, nr: src.nr }; save(); afterCell(it.id, true); return; }
  if (d.filter) { S.filter = d.filter; const vis = visible(); if (vis.length && !vis.some(([, i]) => i === S.cur)) S.cur = vis[0][1]; renderList(); renderViewer(); renderForm(); return; }
  if (d.go) { goPaper(+d.go); return; }
  if (d.recgo) { S.filter = 'recode'; S.bf = 'all'; S.cur = +d.recgo; go2('code'); return; }
  if (d.disgo) { S.filter = 'all'; S.bf = 'all'; S.cur = S.records.findIndex(x => x.mk === d.disgo); S.hl = d.it; go2('code'); return; }
  if (d.restore) { const v = S.versions.find(x => x.v === +d.restore); if (v && confirm(t('restoreConfirm', v.v))) { S.cb = normCb(clone(v.cb)); S.sel = ''; save(); toast(t('restored', v.v)); render(); } return; }
  if (d.delbatch) { if (confirm(t('delBatchConfirm', batchName(+d.delbatch)))) { S.batches = S.batches.filter(x => x.n !== +d.delbatch); S.batches.forEach((x, i) => { x.n = i + 1; }); save(); openModal('batch'); render(); } return; }
  if (d.dlchart) { const it = itemById(d.dlchart), p = { it, it2: it.chart.kind === 'heat' ? itemById(it.chart.with) : null }, svg = chartSVG(it, scopeMks(), LANG);
    if (d.fmt === 'svg') downloadBlob(chartFile(p, 'svg'), new Blob([svg], { type: 'image/svg+xml' })); else svgPng(svg).then(bl => downloadBlob(chartFile(p, 'png'), bl)); return; }
  const act = d.act;
  ({
    lang: () => setLang(LANG === 'zh' ? 'en' : 'zh'),
    settings: () => openModal('settings'),
    guide: () => { S.setTab = 'help'; openModal('settings'); },
    menu: () => $('#menu').classList.toggle('hidden'),
    exMenu: () => $('#' + d.m).classList.toggle('hidden'),
    cbFileMenu: () => $('#cbFileMenu').classList.toggle('hidden'),
    clearFiles: () => { S.files = []; S.ft = null; afterFilesChanged(); },
    clearPdf: () => clearPdfs(), loose: () => openModal('loose'),
    blank: startBlank,
    start: () => {
      if (!S.records.length) return;
      if (multi() && !String(S.settings.cid || '').trim()) { toast(t('needCid')); $('[data-cidinput]')?.focus(); return; }
      go2(!S.cb.items.length || !S.records.some(x => started(x.mk)) ? 'codebook' : 'code');
    },
    home: () => { S.view = 'setup'; store.set('view', 'setup'); closeModal(); renderSetup(); },
    export: () => openModal('export'), close: () => closeModal(),
    ai: () => openModal('ai', { field: S.cb.field, notes: S.cb.notes, rqs: S.cb.blocks.filter(x => x.kind === 'rq').map(x => (x.name.match(/^RQ\s*\d+/i) ? (x.name.match(/^RQ\s*\d+/i)[0] + ' ') : '') + (x.rq || x.name)).join('\n') }),
    copyPrompt: () => { navigator.clipboard?.writeText(aiPrompt(modalData)).then(() => toast(t('promptCopied')), () => toast(t('copyFail'))); },
    paste: () => openModal('paste', { text: '' }),
    usePasted: () => { const R = modalData.parsed; if (!R?.cb || R.errors.length) return; if (S.cb.items.length && !confirm(t('exConfirm'))) return; adoptCb(R.cb); S.sel = ''; toast(t('cbAdopted', R.cb.items.length)); go2('codebook'); },
    exCb: exportCb,
    addBlock: () => { const bl = newBlock('rq', { name: 'RQ' + (S.cb.blocks.filter(x => x.kind === 'rq').length + 1) }); S.cb.blocks.push(bl); S.sel = 'b:' + bl.id; cbChanged(true); },
    delBlock: () => { const bl = blockOf(S.sel.slice(2)); if (!bl || !confirm(t('delBlockConfirm', bl.name))) return; S.cb.blocks = S.cb.blocks.filter(x => x.id !== bl.id); S.sel = ''; cbChanged(true); },
    delItem: () => { const it = itemById(S.sel), n = S.records.filter(x => answered(cellOf(x.mk, it.id))).length; if (!confirm(t('delItemConfirm', cname(it), n))) return; S.cb.items = S.cb.items.filter(x => x.id !== it.id); S.cb.items.forEach(x => { if (x.chart.with === it.id) x.chart.with = ''; }); S.sel = ''; cbChanged(true); },
    addOpt: () => { const it = itemById(S.sel); it.opts.push({ id: uid('o'), label: '', desc: '' }); cbChanged(true); const ins = document.querySelectorAll('#opts [data-ol]'); ins[ins.length - 1]?.focus(); },
    freeze: () => { if (isDirty()) openModal('freeze'); },
    doFreeze: () => { const ids = [...document.querySelectorAll('[data-rc]')].filter(x => x.checked).map(x => x.dataset.rc); const v = S.versions.length + 1, n = doFreeze($('#fReason').value, ids); closeModal(); toast(n ? t('frozenRc', v, n) : t('frozen', v)); render(); },
    discard: () => { const L = latest(); if (L && confirm(t('discardConfirm', L.v))) { S.cb = normCb(clone(L.cb)); S.sel = ''; save(); render(); } },
    batch: () => openModal('batch', { size: modalData.size || 8, seed: newSeed() }),
    reseed: () => { modalData.seed = newSeed(); $('#bSeed').value = modalData.seed; $('#batchList').outerHTML = batchPreview(); },
    doBatch: () => {
      const n = Math.max(1, Math.min(200, +modalData.size || 8)), seed = +modalData.seed >>> 0, list = drawBatch(seed, n); if (!list.length) return;
      const nb = S.batches.length + 1; S.batches.push({ n: nb, seed, size: list.length, mks: list.map(x => x.mk), at: Date.now() });
      S.bf = 'b' + nb; S.filter = 'all'; S.cur = S.records.indexOf(list[0]); save(); closeModal(); toast(t('batchDone', batchName(nb), list.length)); go2('code');
    },
    prev: () => step(-1), next: () => step(1), nextTodo,
    recodeAll: () => { S.filter = 'recode'; S.bf = 'all'; const i = S.records.findIndex(x => recodeOf(x.mk).length); if (i >= 0) S.cur = i; go2('code'); },
    exMine: exportMine, exJson: exportBackup, exCsv: exportCsv,
    ex31svg: () => downloadBlob((S.out.lang31 === 'zh' ? `表${S.out.t31}_编码表概览` : `Table-${S.out.t31}_codebook-overview`) + '.svg', new Blob([table31SVG()], { type: 'image/svg+xml' })),
    ex31png: async () => downloadBlob((S.out.lang31 === 'zh' ? `表${S.out.t31}_编码表概览` : `Table-${S.out.t31}_codebook-overview`) + '.png', await svgPng(table31SVG())),
    exAppMd: () => download((S.out.langApp === 'zh' ? `附录${S.out.app}_编码说明` : `Appendix-${S.out.app}_codebook`) + '.md', appendixMd(), 'text/markdown;charset=utf-8'),
    exAppHtml: () => download((S.out.langApp === 'zh' ? `附录${S.out.app}_编码说明` : `Appendix-${S.out.app}_codebook`) + '.html', appendixHtml(), 'text/html;charset=utf-8'),
    s34: () => openModal('s34'),
    copy34: () => { navigator.clipboard?.writeText(s34()).then(() => toast(t('copied')), () => toast(t('copyFail'))); },
    copyRep: () => { navigator.clipboard?.writeText(teamReport()).then(() => toast(t('copied')), () => toast(t('copyFail'))); },
  }[act] || (() => {}))();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.querySelectorAll('.menu').forEach(m => m.classList.add('hidden')); if ($('#mask')) closeModal(); else if (document.activeElement) document.activeElement.blur(); return; }
  if (S.view !== 'code' || $('#mask')) return;
  const k = e.key, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if ((e.metaKey || e.ctrlKey) && k === 'Enter') { e.preventDefault(); document.activeElement?.blur?.(); nextTodo(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === 'ArrowUp' || k === 'k' || k === 'K') { e.preventDefault(); step(-1); }
  else if (k === 'ArrowDown' || k === 'j' || k === 'J') { e.preventDefault(); step(1); }
  else if (k === '?') { S.setTab = 'help'; openModal('settings'); }
});
document.addEventListener('change', async e => {
  const inp = e.target.closest('input[data-pick]');
  if (inp) {
    const files = [...inp.files], kind = inp.dataset.pick; inp.value = '';
    if (kind === 'rec' || kind === 'recdir') addRecFiles(files);
    else if (kind === 'pdf' || kind === 'pdfdir') addPdfs(files);
    else if (kind === 'one' && files[0]) { const r = S.records[S.cur]; await attachPdf(r.mk, files[0]); savePdfIndex(); refreshAfterPdf(); }
    else if (kind === 'cb' && files[0]) { openModal('paste', { text: await files[0].text() }); }
    return;
  }
  if (e.target.name === 'team_s' || e.target.name === 'team_m') { S.settings.multi = e.target.value === 'multi'; if (S.settings.multi && !String(S.settings.cid || '').trim()) S.settings.cid = 'R1'; saveSettings(); render(); if (modalKind) openModal(modalKind); return; }
  if (e.target.name === 'bkind') { const bl = blockOf(S.sel.slice(2)); bl.kind = e.target.value; cbChanged(true); return; }
  const tg = e.target.dataset?.tg; if (tg) { const it = itemById(S.sel); it[tg] = e.target.checked; cbChanged(true); return; }
  const f = e.target.dataset?.f;
  if (f === 'block') { const it = itemById(S.sel); moveItem(it.id, e.target.value, null); cbChanged(true); return; }
  if (f === 'chartWith') { itemById(S.sel).chart.with = e.target.value; cbChanged(true); return; }
  if (f === 'src') { itemById(S.sel).src = e.target.value; cbChanged(false); return; }
  if (e.target.id === 'scopeChk' || e.target.id === 'scopeCh') { S.scope = e.target.value; render(); }
});
document.addEventListener('input', e => {
  const x = e.target, d = x.dataset || {};
  if (d.cidinput) { S.settings.cid = x.value.trim(); saveSettings(); return; }
  // 编码表的文字：只刷新左边，不重画右边
  if (d.f && ['name', 'def', 'how', 'ex'].includes(d.f)) { itemById(S.sel)[d.f] = x.value; cbChanged(false); return; }
  if (d.ol || d.od) { const it = itemById(S.sel), o = it.opts.find(q => q.id === (d.ol || d.od)); if (d.ol) o.label = x.value; else o.desc = x.value; cbChanged(false); return; }
  if (d.bf) { const bl = blockOf(S.sel.slice(2)); bl[d.bf] = x.value; cbChanged(false); return; }
  if (d.ans) { blockOf(d.ans).answer = x.value; save(); return; }
  // 编码页的文字：存值，不重画这一项
  const r = S.records[S.cur];
  if (d.co) { setCell(r.mk, d.co, { o: x.value }); afterCell(d.co, false); return; }
  if (d.ct) { setCell(r.mk, d.ct, { v: x.value, nr: 0 }); afterCell(d.ct, false); return; }
  if (d.cn) { setCell(r.mk, d.cn, { v: x.value.trim(), nr: 0 }); afterCell(d.cn, false); return; }
  if (d.cevt) { setCell(r.mk, d.cevt, { ev: x.value }); afterCell(d.cevt, false); return; }
});
// 拖动编码表里的项：可以在块里换顺序，也可以拖到别的块
let dragId = '';
document.addEventListener('dragstart', e => { const row = e.target.closest?.('.irow'); if (!row) return; dragId = row.dataset.item; row.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* 忽略 */ } });
document.addEventListener('dragend', () => { dragId = ''; document.querySelectorAll('.irow.drag,.irow.over').forEach(x => x.classList.remove('drag', 'over')); });
document.addEventListener('dragover', e => { if (!dragId) return; const row = e.target.closest('.irow,.addrow'); if (!row) return; e.preventDefault(); document.querySelectorAll('.irow.over').forEach(x => x.classList.remove('over')); if (row.classList.contains('irow')) row.classList.add('over'); });
document.addEventListener('drop', e => {
  if (!dragId) return; const row = e.target.closest('.irow,.addrow'); if (!row) return; e.preventDefault();
  if (row.classList.contains('irow')) { const tgt = itemById(row.dataset.item); if (tgt && tgt.id !== dragId) moveItem(dragId, tgt.block, tgt.id); }
  else moveItem(dragId, row.dataset.dropb, null);
  dragId = ''; cbChanged(true);
});
window.addEventListener('beforeunload', () => { saveNow(); });

// 打开页面时：恢复上次的记录、PDF、编码表和进度；上次停在哪一页，就回到哪一页
(async function init() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  const saved = await DB.get('files');
  if (saved && Array.isArray(saved.bibs) && saved.bibs.length) {
    S.files = saved.bibs.map(f => ({ name: f.name, text: f.text, recs: parseBib(f.text || '', f.name) })).filter(f => f.recs.length);
    S.ft = saved.ft || null;
    rebuild();
    const pi = await DB.get('pdfindex'); if (pi) { S.pdf = pi.pdf || {}; S.loose = pi.loose || []; }
  }
  const had = await loadProj();
  const v = store.get('view', 'setup');
  if (S.records.length && had && v !== 'setup') { S.view = v; render(); toast(t('restoredAll')); return; }
  renderSetup();
})();
})();
