<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摘要筛选助手 · Abstract Screener</title>
<style>
:root {
  --bg: #f6f2ea; --panel: #fffdf8; --card: #ffffff; --line: #e9e1d5; --line2: #d8ccbb;
  --ink: #29231c; --ink2: #574e44; --muted: #8b8175;
  --brand: #8a5a3b; --brand-soft: #f4e8dc;
  --keep: #2c7a4b; --keep-soft: #e2f1e7; --excl: #c0392b; --excl-soft: #fbe6e2;
  --unsure: #a86b12; --unsure-soft: #fcf0d7;
  --ai: #4b44b0; --ai-soft: #ecebfa;
  --mark: #ffe27a; --todo: #ddd3c5;
  --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 8px 28px rgba(60, 40, 20, .08);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, "Songti SC", "Noto Serif SC", serif;
}
* { box-sizing: border-box; }
html, body, #app { margin: 0; height: 100%; }
body { font: 15px/1.5 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
kbd { font: 600 11px/1 var(--sans); padding: 3px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; margin-left: 6px; }
.hidden { display: none !important; }

/* ---------- 顶栏 ---------- */
.shell { display: flex; flex-direction: column; height: 100%; }
.top { display: flex; align-items: center; gap: 24px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 58px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.prog { flex: 1; min-width: 180px; max-width: 560px; margin: 0 auto; }
.prog .nums { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; }
.prog .nums b { color: var(--ink); font-size: 15px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.k { background: var(--keep); } .dot.x { background: var(--excl); } .dot.t { background: var(--todo); } .dot.a { background: var(--ai); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--todo); }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar .k { background: var(--keep); } .bar .x { background: var(--excl); }
.aibar { margin-top: 6px; height: 4px; border-radius: 99px; background: var(--ai-soft); overflow: hidden; }
.aibar i { display: block; height: 100%; background: var(--ai); transition: width .3s; }
.tools { display: flex; gap: 8px; }
.tb { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line2); background: var(--card); border-radius: 10px; font-size: 13.5px; color: var(--ink2); white-space: nowrap; }
.tb:hover { border-color: var(--brand); color: var(--brand); }
.tb.ai { border-color: #cfcbf3; color: var(--ai); background: var(--ai-soft); }
.tb.ai.on { background: var(--ai); color: #fff; border-color: var(--ai); }

/* ---------- 三栏 ---------- */
.main { display: grid; grid-template-columns: 270px minmax(0, 1fr) 330px; flex: 1; min-height: 0; }
.list { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 14px 8px; }
.tab { border: 1px solid var(--line2); background: transparent; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; color: var(--ink2); }
.tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tab .n { opacity: .65; margin-left: 4px; }
.search { margin: 4px 14px 10px; padding: 7px 11px; border: 1px solid var(--line2); border-radius: 9px; background: var(--card); }
.items { overflow: auto; flex: 1; padding: 0 8px 12px; }
.it { display: grid; grid-template-columns: 30px 1fr 8px; gap: 6px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.it:hover { background: var(--brand-soft); }
.it.cur { background: var(--card); box-shadow: inset 3px 0 0 var(--brand), 0 1px 3px rgba(0,0,0,.06); color: var(--ink); }
.it .i { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.it .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .dot { margin: 0; }
.it .st { display: flex; gap: 3px; padding-top: 4px; }
.empty-list { color: var(--muted); font-size: 13px; padding: 20px 14px; }

.center { overflow: auto; position: relative; display: flex; flex-direction: column; }
.paper { width: 100%; max-width: 820px; margin: 0 auto; padding: 30px 34px 0; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 600; }
.chip.g { background: #efebe4; color: var(--ink2); font-weight: 500; }
.chip.warn { background: var(--unsure-soft); color: var(--unsure); }
.paper h1 { font: 650 24px/1.34 var(--sans); margin: 10px 0 8px; letter-spacing: -.005em; }
.meta .stamp { margin-left: auto; }
.byline { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kwl { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.6; }
.kwl .sep { color: var(--line2); }
.addnote { margin: 2px 0 14px; font-size: 13px; color: var(--muted); }
.authors { color: var(--ink2); font-size: 14px; }
.venue { color: var(--muted); font-size: 13.5px; font-style: italic; margin-top: 2px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.kw { font-size: 12.5px; padding: 2px 9px; border: 1px solid var(--line2); border-radius: 99px; color: var(--ink2); background: var(--card); }
.abs { font: 17.5px/1.72 var(--serif); color: #2e2821; margin: 18px 0 10px; padding: 22px 26px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.abs .lab { font: 700 11.5px/1 var(--sans); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
.abs.none { color: var(--muted); font-style: italic; }
mark.ev { background: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%); color: inherit; padding: 0 1px; border-radius: 3px; }
mark.ev.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { background: #ffc94d; box-shadow: 0 0 0 3px #ffc94d; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hk { text-decoration: underline 2px var(--keep); text-underline-offset: 4px; }
.hx { text-decoration: underline 2px var(--excl); text-underline-offset: 4px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding: 4px 11px; border-radius: 8px; }
.stamp.k { background: var(--keep-soft); color: var(--keep); } .stamp.x { background: var(--excl-soft); color: var(--excl); }
.note { width: 100%; margin: 6px 0 18px; border: 1px dashed var(--line2); background: transparent; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; resize: vertical; min-height: 38px; }
.note:focus { outline: none; border-style: solid; border-color: var(--brand); background: var(--card); }

.decide { position: sticky; bottom: 0; background: linear-gradient(rgba(246, 242, 234, 0), var(--bg) 26%); padding: 20px 34px 12px; }
.decide .row { max-width: 792px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.big { border: 0; border-radius: 14px; padding: 13px 18px; font-size: 16.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .06s, box-shadow .2s; box-shadow: var(--shadow); }
.big:active { transform: translateY(1px); }
.big.x { background: var(--card); color: var(--excl); border: 2px solid #f0c9c2; }
.big.x:hover, .big.x.sel { background: var(--excl); color: #fff; border-color: var(--excl); }
.big.k { background: var(--keep); color: #fff; border: 2px solid var(--keep); }
.big.k:hover { filter: brightness(1.06); }
.big.k.sel { box-shadow: 0 0 0 4px #bfe3cc; }
.big small { font-weight: 500; opacity: .8; font-size: 13px; }
.reasons { display: flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--muted); overflow-x: auto; scrollbar-width: none; min-width: 0; }
.reasons > span { white-space: nowrap; margin-right: 2px; }
.rc { flex: none; border: 1px solid #f1d8d2; background: var(--card); color: var(--excl); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.rc i { font-style: normal; opacity: .55; margin-right: 3px; font-weight: 500; }
.rc:hover, .rc.sel { background: var(--excl-soft); border-color: var(--excl); }
.rc.sug { box-shadow: 0 0 0 2px var(--ai-soft); border-color: var(--ai); }
.minor { max-width: 792px; margin: 10px auto 0; display: flex; gap: 12px; justify-content: space-between; align-items: center; font-size: 13px; }
.navs { display: flex; gap: 2px; flex: none; }
.ib { border: 0; background: none; width: 32px; height: 30px; border-radius: 8px; color: var(--ink2); font-size: 15px; }
.ib:hover { background: var(--brand-soft); color: var(--brand); }
.ib.on { color: #b7791f; }
.ib:disabled { opacity: .35; cursor: default; background: none; }
.lnk { border: 0; background: none; color: var(--ink2); padding: 4px 6px; border-radius: 7px; }
.lnk:hover { background: var(--brand-soft); color: var(--brand); }
.lnk.on { color: #b7791f; }

.side { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 22px 18px 30px; }
.critbox summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.critbox summary::-webkit-details-marker { display: none; }
.critbox summary h3 { margin: 0; }
.critbox summary .hint::after { content: ' ▾'; }
.critbox[open] summary { margin-bottom: 10px; }
.critbox[open] summary .hint::after { content: ' ▴'; }
.critline { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.ghost.sm { padding: 6px 12px; font-size: 13px; margin-top: 10px; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; z-index: 10; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--ink2); }
.menu button:hover { background: var(--brand-soft); color: var(--brand); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.tb.icon { padding: 6px 12px; font-size: 17px; line-height: 1; }
.finds { padding: 0 14px 10px; display: grid; gap: 6px; }
.finds .search { margin: 0; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
details.more[open] > summary { margin-bottom: 10px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; margin-bottom: 14px; }
.box h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.aibox { border-color: #d8d5f5; }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.verdict .tag { padding: 3px 10px; border-radius: 8px; }
.v-exclude .tag { background: var(--excl-soft); color: var(--excl); }
.v-include .tag { background: var(--keep-soft); color: var(--keep); }
.v-unsure .tag { background: var(--unsure-soft); color: var(--unsure); }
.verdict .code { font-size: 13px; color: var(--ink2); font-weight: 600; }
.why { margin: 10px 0 4px; color: var(--ink); line-height: 1.6; }
.evl { margin: 8px 0 0; padding: 0; list-style: none; }
.evl li { font: 14px/1.5 var(--serif); padding: 7px 10px; margin-top: 6px; background: #fffbea; border-left: 3px solid var(--mark); border-radius: 0 8px 8px 0; cursor: pointer; }
.evl li:hover { background: #fff4c2; }
.evl li.miss { opacity: .6; cursor: default; }
.mutedp { color: var(--muted); font-size: 13.5px; margin: 0; }
.agree { margin-top: 10px; font-size: 12.5px; padding: 6px 9px; border-radius: 8px; }
.agree.no { background: var(--unsure-soft); color: var(--unsure); }
.agree.yes { background: #f0efe9; color: var(--muted); }
.crit { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
.crit li { display: grid; grid-template-columns: 46px 1fr; gap: 6px; padding: 5px 0; border-top: 1px dashed var(--line); }
.crit li:first-child { border-top: 0; }
.crit .c { font-weight: 700; font-size: 12px; padding-top: 2px; }
.crit.ic .c { color: var(--keep); } .crit.ec .c { color: var(--excl); }
.crit .k { color: var(--muted); font-size: 11px; font-weight: 500; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

/* ---------- 开始页 ---------- */
.setup { max-width: 1060px; margin: 0 auto; padding: 46px 28px 60px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { font-size: 32px; margin: 12px 0 8px; letter-spacing: .02em; }
.hero p { color: var(--ink2); margin: 0 auto; max-width: 640px; font-size: 15.5px; }
.steps { display: grid; grid-template-columns: 1fr 1.35fr; gap: 18px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); }
.step.wide { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.step h2 { font-size: 17px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
.num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 14px; flex: none; }
.step p { margin: 0 0 14px; color: var(--ink2); font-size: 14px; }
.drop { text-align: center; border: 2px dashed var(--line2); border-radius: 14px; padding: 20px 14px 16px; color: var(--ink2); transition: .15s; background: var(--panel); }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.drop input { display: none; }
.files { margin-top: 12px; font-size: 13.5px; }
.files div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px dashed var(--line); }
.files div > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files div > span:last-child { flex: none; }
.pickrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.pick { cursor: pointer; }
.herobtns { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
.seg { display: flex; gap: 4px; background: #efe9df; padding: 4px; border-radius: 12px; margin: 6px 0 18px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.pane { min-height: 280px; }
.radios { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.rd { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 400; cursor: pointer; }
.aisum { font-size: 13.5px; color: var(--ink2); margin: 0 0 12px; }
.guide ol { padding-left: 20px; margin: 0 0 14px; line-height: 1.7; font-size: 14px; }
.guide li { margin-bottom: 6px; }
.guide h4 { margin: 16px 0 10px; font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.files .sum { font-weight: 700; color: var(--ink); }
.lab2 { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 13.5px; margin: 10px 0 6px; }
.lab2 .ic { color: var(--keep); } .lab2 .ec { color: var(--excl); }
textarea.ta { width: 100%; min-height: 96px; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; line-height: 1.55; resize: vertical; background: var(--panel); }
textarea.ta:focus, input.in:focus, select.in:focus { outline: none; border-color: var(--brand); background: var(--card); }
input.in, select.in { width: 100%; border: 1px solid var(--line2); border-radius: 9px; padding: 8px 10px; font-size: 13.5px; background: var(--panel); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.primary { border: 0; background: var(--brand); color: #fff; padding: 12px 22px; border-radius: 12px; font-weight: 700; font-size: 15.5px; box-shadow: var(--shadow); white-space: nowrap; }
.primary:disabled { background: var(--line2); cursor: not-allowed; box-shadow: none; }
.primary.ai { background: var(--ai); }
.ghost { border: 1px solid var(--line2); background: var(--card); padding: 8px 14px; border-radius: 10px; font-size: 13.5px; white-space: nowrap; }
.ghost:hover { border-color: var(--brand); color: var(--brand); }
.foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }

/* ---------- 弹窗 ---------- */
.mask { position: fixed; inset: 0; background: rgba(40, 30, 20, .32); display: grid; place-items: center; z-index: 20; padding: 20px; }
.modal { background: var(--panel); border-radius: 18px; box-shadow: 0 20px 60px rgba(40, 30, 20, .25); width: min(680px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 24px 26px; }
.modal h2 { margin: 0 0 4px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal .x { border: 0; background: none; font-size: 22px; color: var(--muted); line-height: 1; }
.modal .sub { color: var(--ink2); font-size: 13.5px; margin: 0 0 16px; }
.fld { margin-bottom: 12px; }
.fld label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
.fld .hint { margin-top: 4px; }
.privacy { background: var(--ai-soft); color: #39338a; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin: 4px 0 14px; }
.est { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.est b { color: var(--ink); }
.actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: 14px; }
details.pp summary { cursor: pointer; font-size: 13px; color: var(--ink2); }
details.pp pre { white-space: pre-wrap; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 240px; overflow: auto; }
.ex-grid { display: grid; gap: 10px; }
.ex { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; }
.ex b { display: block; } .ex span { color: var(--muted); font-size: 13px; }
.ex > :last-child { flex: none; }   /* 说明文字再长，右边的按钮也不被挤成两行 */
pre.prisma { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 13.5px/1.7 var(--sans); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; align-items: center; }
.keys kbd { opacity: 1; margin: 0; justify-self: start; }
.duprow { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.duprow span { color: var(--muted); font-size: 12.5px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 30; box-shadow: var(--shadow); }

@media (max-width: 1180px) { .main { grid-template-columns: 250px minmax(0, 1fr) 300px; } .paper { padding: 22px 24px 0; } .decide { padding: 18px 24px 14px; } }
@media (max-width: 960px) {
  .shell { height: auto; } .main { grid-template-columns: 1fr; } .list { max-height: 260px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side { border-left: 0; } .steps { grid-template-columns: 1fr; } .step.wide { flex-direction: column; align-items: stretch; }
  .top { flex-wrap: wrap; } .prog { order: 3; flex-basis: 100%; max-width: none; }
}

/* ---------- 多人筛选 ---------- */
.dot.c { background: var(--unsure); }
.stamp.c { background: var(--unsure-soft); color: var(--unsure); }
.stamp.g { background: #efebe4; color: var(--ink2); font-weight: 600; }
.seg.mini { margin: 0; padding: 3px; flex: none; }
.seg.mini button { flex: none; padding: 5px 12px; font-size: 13px; }
.ridchip { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }

  const zh = LANG === 'zh', ts = teamStats(), f2 = v => v.toFixed(2), pc = v => (100 * v).toFixed(1);
  const names = R.map(x => x.rid).join(zh ? '、' : ', '), done = ts.conf === ts.res;
  if (R.length === 2) {
    const c = cohen(R[0].dec, R[1].dec); if (!c) return '';
    const [a, b] = [R[0].rid, R[1].rid];
    return zh
      ? `两位审阅人（${names}）独立筛选了全部 ${ts.n} 条记录。两人都筛过的 ${c.n} 条中，判断一致 ${c.ag} 条（${pc(c.po)}%，Cohen's κ = ${f2(c.k)}）；有分歧 ${c.n - c.ag} 条（${a} 保留、${b} 排除 ${c.kx} 条；${a} 排除、${b} 保留 ${c.xk} 条），${done ? '全部经讨论统一。' : `已经讨论统一 ${ts.res} 条。`}`
      : `Two reviewers (${names}) independently screened all ${ts.n} records. Of the ${c.n} records both screened, they agreed on ${c.ag} (${pc(c.po)}%, Cohen's κ = ${f2(c.k)}). The ${c.n - c.ag} disagreements (${a} keep / ${b} exclude: ${c.kx}; ${a} exclude / ${b} keep: ${c.xk}) ${done ? 'were all resolved by discussion.' : `are being resolved by discussion (${ts.res} so far).`}`;
  }
  const fl = fleiss(R); if (!fl) return '';
  const pairs = [];
  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) { const c = cohen(R[i].dec, R[j].dec); if (c) pairs.push(`${R[i].rid}–${R[j].rid} ${f2(c.k)}`); }
  return zh
    ? `${R.length} 位审阅人（${names}）独立筛选了全部 ${ts.n} 条记录。所有人都筛过的 ${fl.N} 条中，全体一致 ${fl.uni} 条（${pc(fl.uni / fl.N)}%，Fleiss' κ = ${f2(fl.k)}）；两两之间的 Cohen's κ：${pairs.join('；')}。有分歧的 ${ts.conf} 条，${done ? '全部经讨论统一。' : `已经讨论统一 ${ts.res} 条。`}`
    : `${R.length} reviewers (${names}) independently screened all ${ts.n} records. Of the ${fl.N} records all screened, all agreed on ${fl.uni} (${pc(fl.uni / fl.N)}%, Fleiss' κ = ${f2(fl.k)}); pairwise Cohen's κ: ${pairs.join('; ')}. The ${ts.conf} disagreements ${done ? 'were all resolved by discussion.' : `are being resolved by discussion (${ts.res} so far).`}`;
}

/* ================= 高亮 ================= */
const fold = s => s.toLowerCase().replace(/[‘’′]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-');
function findQuote(text, q) {
  const T = fold(text); let Q = fold(String(q || '').trim()).replace(/^["'\s.…]+|["'\s.…]+$/g, '');
  if (Q.length < 3) return null;
  let i = T.indexOf(Q); if (i >= 0) return [i, i + Q.length];
  const w = Q.split(/\s+/);
  for (const len of [10, 7, 5]) {
    if (w.length <= len) continue;
    const head = w.slice(0, len).join(' '); i = T.indexOf(head);
    if (i >= 0) { const tail = w.slice(-3).join(' '); const e = T.indexOf(tail, i); return [i, e > i && e - i < Q.length * 1.6 ? e + tail.length : i + head.length]; }
  }
  return null;
}
function marked(text, quotes, withTerms) {
  if (!text) return '';
  const n = text.length; const ev = new Int8Array(n); const tk = new Int8Array(n);
  (quotes || []).forEach((q, qi) => { const m = findQuote(text, q); if (m) for (let i = m[0]; i < m[1]; i++) ev[i] = qi + 1; });
  if (withTerms) {
    const mark = (list, v) => list.forEach(w => {
      const re = new RegExp('(^|[^A-Za-z0-9])(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=[^A-Za-z0-9]|$)', 'gi'); let m;
      while ((m = re.exec(text))) { const s = m.index + m[1].length; for (let i = s; i < s + m[2].length; i++) tk[i] = v; }
    });
    mark(terms(S.crit.keep), 1); mark(terms(S.crit.excl), 2);
  }
  let out = '', i = 0;
  while (i < n) {
    let j = i; while (j < n && ev[j] === ev[i] && tk[j] === tk[i]) j++;
    let seg = esc(text.slice(i, j));
    if (tk[i]) seg = `<span class="${tk[i] === 1 ? 'hk' : 'hx'}">${seg}</span>`;
    if (ev[i]) seg = `<mark class="ev" data-q="${ev[i]}">${seg}</mark>`;
    out += seg; i = j;
  }
  return out;
}

// 拖进来的可能是文件，也可能是文件夹：文件夹逐层读出里面的文件
async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async (entry, path) => {
    if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file: f, path: path + f.name }); return; }
    if (!entry.isDirectory) return;
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const e of batch) await walk(e, path + entry.name + '/');
    }
  };
  for (const e of entries) await walk(e, '');
  return out;
}
async function addFiles(list, fromDir) {
  let n = 0;
  for (const it of list) {
    const f = it.file || it, name = it.path || f.webkitRelativePath || f.name;
    if (!((fromDir || it.path) ? /\.(bib|bibtex)$/i : /\.(bib|bibtex|txt)$/i).test(f.name)) continue;
    n++;
    const text = await f.text(), recs = parseBib(text, name);
    if (!recs.length) { toast(t('parseFail', name)); continue; }
    S.files = S.files.filter(x => x.name !== name).concat([{ name, text, recs }]);
  }
  if (!n && list.length) toast(t('noBib'));
  await afterFilesChanged();
}
// 记录集合变了（加了或删了文件）：已经做过的判断按记录对上，接着用
function carryOver(old) {
  const map = {}; S.records.forEach(r => r.uids.forEach(u => { map[u] = r.id; }));
  const mv = obj => { const o = {}; for (const [k, v] of Object.entries(obj || {})) if (map[k] && !(map[k] in o)) o[map[k]] = v; return o; };
  ['dec', 'star', 'note', 'ai', 'final'].forEach(k => { S[k] = Object.assign({}, S[k], mv(old[k])); });   // 内存里的是最新的
  for (const [rid, o] of Object.entries(old.others || {})) S.others[rid] = { ...o, dec: Object.assign({}, S.others[rid]?.dec, mv(o.dec)), note: Object.assign({}, S.others[rid]?.note, mv(o.note)) };
}
async function afterFilesChanged() {
  const old = { dec: S.dec, star: S.star, note: S.note, ai: S.ai, final: S.final, others: S.others };
  rebuild(); saveFiles();
  if (!S.records.length) { S.view = 'setup'; store.set('view', 'setup'); renderSetup(); if (modalKind === 'settings') openModal('settings'); return; }
  await load(); carryOver(old); save();
  if (S.view === 'main') renderMain(); else renderSetup();
  if (modalKind === 'settings') openModal('settings');
}

function visible() {
  const q = S.q.trim().toLowerCase();
  return S.records.map((r, i) => [r, i]).filter(([r]) => {
    if (team()) {
      const st = status(r.id);
      if (S.filter === 'unres' && !(st === 'conflict' && !S.final[r.id])) return false;
      if (S.filter === 'conf' && st !== 'conflict') return false;
      if (S.filter === 'agree' && st !== 'agree') return false;
      if (S.filter === 'part' && st !== 'partial') return false;
    } else {
      const d = S.dec[r.id]?.d;
      if (S.filter === 'todo' && d) return false;
      if (S.filter === 'keep' && d !== 'keep') return false;
      if (S.filter === 'excl' && d !== 'excl') return false;
      if (S.filter === 'star' && !S.star[r.id]) return false;
      if (S.filter === 'diff' && aiOn() && !differs(r.id)) return false;
    }
    if (aiOn() && S.aiFilter !== 'any') { const a = S.ai[r.id]; if (!a || a.err || a.decision !== S.aiFilter) return false; }
    if (q && !(r.title + ' ' + r.abstract + ' ' + r.keywords.join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
}

const pending = id => (team() ? status(id) === 'conflict' && !S.final[id] : !S.dec[id]);

  const prev = box[r.id] ? { ...box[r.id] } : null;
  if (kind === 'excl' && !ec && prev?.d === 'excl') ec = prev.ec;   // 改判时保留原来的理由
  box[r.id] = { d: kind, ec: kind === 'excl' ? (ec || '') : '', at: Date.now() };
  S.hist.push({ id: r.id, prev, f: tm ? 1 : 0 });

const outLangName = () => { const s = S.settings; return s.outLang === 'en' ? 'English' : s.outLang === 'other' ? (s.outOther.trim() || 'English') : 'Simplified Chinese'; };
const outLangLabel = () => { const s = S.settings; return s.outLang === 'en' ? 'English' : s.outLang === 'other' ? (s.outOther.trim() || t('other')) : '中文'; };
function systemPrompt() {
  const lang = outLangName();
  const s = S.settings;
  return [
    'You are helping a researcher screen records for a scoping review at the title-and-abstract stage.',
    'Judge ONLY from the title, keywords and abstract you are given. Do not assume anything that is not stated.',
    '', 'Inclusion criteria:', ...IC().map(c => `${c.code}: ${c.text}`),
    '', 'Exclusion criteria:', ...EC().map(c => `${c.code}: ${c.text}`),
    ...(s.extra.trim() ? ['', 'Notes from the researcher:', s.extra.trim()] : []),
    '', 'Choose one decision:',
    '- "exclude": at least one exclusion criterion clearly applies, or the record clearly fails an inclusion criterion. Put the code of the single most direct criterion in "criterion".',
    '- "include": the record appears to meet the inclusion criteria. Put the code of the main inclusion criterion it meets in "criterion".',
    '- "unsure": the title and abstract do not give enough information to decide; the researcher will keep it for full-text reading. When in doubt, choose "unsure" rather than "exclude".',
    '', `Write "reason" as one short sentence in ${lang}.`,
    'In "evidence", copy 1 to 3 short phrases VERBATIM from the title or abstract (each under 25 words) that support your decision. Keep them in the original language of the abstract: do not translate or paraphrase them, even though the reason is in another language.',
    'Reply with a JSON object only, in exactly this form:',
    '{"decision": "include" | "exclude" | "unsure", "criterion": "EC1", "reason": "...", "evidence": ["...", "..."]}',
  ].join('\n');
}
const userMsg = r => `Title: ${r.title}\nKeywords: ${r.keywords.join('; ') || '(none)'}\nAbstract: ${r.abstract || '(no abstract available)'}`;
function parseAI(txt) {
  let s = String(txt || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a >= 0 && b > a) s = s.slice(a, b + 1);
  let o; try { o = JSON.parse(s); } catch (e) { throw new Error(t('errParse')); }
  let d = String(o.decision || '').toLowerCase().trim(); if (!['include', 'exclude', 'unsure'].includes(d)) d = 'unsure';
  const ev = (Array.isArray(o.evidence) ? o.evidence : [o.evidence]).filter(Boolean).map(String).slice(0, 4);
  return { decision: d, criterion: String(o.criterion || '').replace(/\s+/g, '').toUpperCase().slice(0, 12), reason: String(o.reason || '').trim(), evidence: ev };
}
async function callAI(r, outer) {
  const s = S.settings;
  const url = s.base.trim().replace(/\/+$/, '') + '/chat/completions';
  const body = { model: s.model.trim(), temperature: 0, max_tokens: s.think ? 4000 : 600, response_format: { type: 'json_object' },
    messages: [{ role: 'system', content: systemPrompt() }, { role: 'user', content: userMsg(r) }] };
  // DeepSeek 默认先“思考”再回答；筛摘要用不着，关掉更快更省。别家的接口不认这个参数，就不传
  if (/deepseek/i.test(s.base)) body.thinking = { type: s.think ? 'enabled' : 'disabled' };
  for (let attempt = 0; attempt < 5; attempt++) {
    if (outer.aborted) throw new DOMException('stop', 'AbortError');
    const ctrl = new AbortController(); const stop = () => ctrl.abort(); outer.addEventListener('abort', stop);
    const timer = setTimeout(() => ctrl.abort(), 90000);
    let res;
    try { res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY.trim() }, body: JSON.stringify(body), signal: ctrl.signal }); }
    catch (e) { if (outer.aborted) throw e; await sleep(1500 * (attempt + 1)); continue; }
    finally { clearTimeout(timer); outer.removeEventListener('abort', stop); }
    if (res.status === 429 || res.status >= 500) { await sleep(2500 * (attempt + 1)); continue; }
    if (res.status === 400 && (body.response_format || body.thinking)) { delete body.response_format; delete body.thinking; continue; }
    if (res.status === 401) throw new Error(t('err401'));
    if (res.status === 402) throw new Error(t('err402'));
    if (!res.ok) throw new Error(t('errHttp', res.status));
    const data = await res.json();
    const u = data.usage || {}; S.usage.in += u.prompt_tokens || 0; S.usage.out += u.completion_tokens || 0;
    const content = data.choices?.[0]?.message?.content;
    if (!String(content || '').trim() && attempt < 4) continue;   // JSON 模式偶尔返回空内容，再要一次
    return Object.assign(parseAI(content), { model: data.model || s.model, at: Date.now() });
  }
  throw new Error(t('errRetry'));
}
function aiTargets(scope) {
  return S.records.filter(r => scope === 'all' ? true : scope === 'unscreened' ? !S.dec[r.id] : !(S.ai[r.id] && !S.ai[r.id].err)).map(r => r.id);
}
async function runAI(ids) {
  if (AI.running || !ids.length) return;
  Object.assign(AI, { running: true, paused: false, queue: ids.slice(), done: 0, total: ids.length, fail: 0, ctrl: new AbortController() });
  renderProg(); refreshAIModal();
  const worker = async () => {
    while (AI.running && !AI.paused && AI.queue.length) {
      const id = AI.queue.shift(); const r = S.byId[id];
      try { S.ai[id] = await callAI(r, AI.ctrl.signal); }
      catch (e) {
        if (AI.ctrl.signal.aborted) { AI.queue.unshift(id); break; }
        S.ai[id] = { err: e.message }; AI.fail++;
        if (/401|402/.test(e.message)) { AI.paused = true; toast(e.message); }
      }
      AI.done++; save(); renderProg(); refreshAIModal();
      if (S.records[S.cur]?.id === id) { renderSide(); renderCard(); }
    }
  };
  await Promise.all(Array.from({ length: Math.max(1, Math.min(8, +S.settings.conc || 4)) }, worker));
  const finished = !AI.queue.length;

  if (finished) toast(t('aiFinished', AI.done, AI.fail));

}

  const tin = Math.round(chars / 3.6), tout = ids.length * 90;

      <details class="more"><summary>${t('advanced')}</summary>
        <div class="two"><div class="fld"><label>${t('concLab')}</label><input class="in" id="conc" type="number" min="1" max="8" value="${esc(s.conc)}"></div>
          <div class="fld"><label>${t('priceLab')}</label><div class="two" style="gap:6px"><input class="in" id="pin" type="number" step="0.1" min="0" value="${esc(s.pin)}"><input class="in" id="pout" type="number" step="0.1" min="0" value="${esc(s.pout)}"></div></div></div>
        <div class="hint" style="margin:-4px 0 12px">${t('priceHint')}</div>
        <label class="rd" style="margin:0 0 12px"><input type="checkbox" id="think" ${s.think ? 'checked' : ''}> ${t('thinkLab')}</label>
        <div class="fld"><label>${t('extraLab')}</label><textarea class="ta" id="extra" style="min-height:54px" placeholder="${esc(t('extraPh'))}">${esc(s.extra)}</textarea></div>
        <details class="pp"><summary>${t('promptPrev')}</summary><pre id="pp"></pre></details>
      </details>`);
    if (tab === 'help') body = guideHTML();
    return head('⚙ ' + t('setTitle')) + `<div class="seg">${tabs.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div><div class="pane">${body}</div>`;
  }
  if (kind === 'crit') return head(t('critModal'), t('critSub')) + critForm() + `<div class="actions"><button class="primary" data-act="close">${t('save')}</button></div>`;
  if (kind === 'export') return head(t('exportTitle'), t('exportSub')) + `
    <div class="ex-grid">
      ${multi() ? `<div class="ex"><div><b>${t('exMine')}</b><span>${t('exMineD')}</span></div><button class="ghost" data-act="exMine">${t('download')}</button></div>` : ''}
      ${hasTeam() ? `<div class="ex"><div><b>${t('exCompare')}</b><span>${t('exCompareD')}</span></div><button class="ghost" data-act="exCompare">${t('download')}</button></div>` : ''}
      <div class="ex"><div><b>${t('exCsv')}</b><span>${t('exCsvD')}</span></div><button class="ghost" data-act="exCsv">${t('download')}</button></div>
      <div class="ex"><div><b>${t('exBib')}</b><span>${hasTeam() ? t('exBibTeamD') : t('exBibD')}</span></div><button class="ghost" data-act="exBib">${t('download')}</button></div>
      <div class="ex"><div><b>${t('exJson')}</b><span>${t('exJsonD')}</span></div><span style="display:flex;gap:8px"><button class="ghost" data-act="exJson">${t('download')}</button>
        <label class="ghost" style="cursor:pointer">${t('exImp')}<input type="file" id="impJson" accept=".json" class="hidden"></label></span></div>
    </div>
    <div class="lab2" style="margin-top:18px"><span>${t('prisma')}</span><button class="lnk" data-act="copyPrisma">${t('copy')}</button></div>
    <pre class="prisma" id="prismaTxt">${esc(prismaText())}</pre>`;
  if (kind === 'dups') return head(t('dupTitle'), t('dupSub')) + S.dups.map(d => `<div class="duprow">${esc(d.title)}<br><span>${esc(d.a)}　⇄　${esc(d.b)}</span></div>`).join('');
  return '';
}
function guideHTML() {
  return `<div class="guide"><ol>${GUIDE[LANG].map(x => `<li>${x}</li>`).join('')}</ol>
    <h4>${t('kTitle')}</h4><div class="keys">
    <kbd>←</kbd><span>${t('kExcl')}</span><kbd>→</kbd><span>${t('kKeep')}</span><kbd>1 … 9</kbd><span>${t('kNum')}</span>
    <kbd>Z</kbd><span>${t('kUndo')}</span><kbd>↑ ↓</kbd><span>${t('kNav')}</span><kbd>S</kbd><span>${t('kStar')}</span><kbd>N</kbd><span>${t('kNote')}</span><kbd>Esc</kbd><span>${t('kEsc')}</span></div>
    <p class="hint" style="margin-top:16px">${t('guideMore')}</p></div>`;
}
function setAI(on) {
  S.settings.useAI = on; saveSettings();
  if (!on && S.filter === 'diff') S.filter = 'all';
  if (S.view === 'main') renderMain(); else if (!$('#mask')) renderSetup(); else { const c = $('#useAI'); if (c) c.checked = on; }
}
function setLang(v) {
  LANG = v; store.set('lang', LANG); document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  if (S.view === 'main') renderMain(); else renderSetup();
  if (modalKind) openModal(modalKind);
}
const updPrompt = () => { const pp = $('#pp'); if (pp) pp.textContent = systemPrompt() + '\n\n---\n' + (S.records[S.cur] ? userMsg(S.records[S.cur]) : ''); };
function bindModal(kind) {
  if (kind === 'crit') bindCritForm();
  if (kind === 'ai') $('#scope').onchange = e => { S.settings.scope = e.target.value; saveSettings(); refreshAIModal(); };
  if (kind === 'team') $('#impOthers').onchange = e => importOthers([...e.target.files]);
  if (kind === 'settings' && (S.setTab || 'files') === 'lang') {
    document.querySelectorAll('input[name=ui]').forEach(r => { r.onchange = () => setLang(r.value); });
    document.querySelectorAll('input[name=out]').forEach(r => {
      r.onchange = () => { S.settings.outLang = r.value; $('#outOther').disabled = r.value !== 'other'; saveSettings(); if (r.value === 'other') $('#outOther').focus(); };
    });
    $('#outOther').oninput = e => { S.settings.outOther = e.target.value; saveSettings(); };
  }
  if (kind === 'settings' && S.setTab === 'api') document.querySelectorAll('input[name=aimode]').forEach(r => { r.onchange = () => { setAI(r.value === 'on'); openModal('settings'); }; });
  if (kind === 'settings' && S.setTab === 'api' && aiOn()) {
    const upd = () => {
      Object.assign(S.settings, { base: $('#base').value, model: $('#model').value, conc: +$('#conc').value || 4,
        pin: +$('#pin').value || 0, pout: +$('#pout').value || 0, extra: $('#extra').value, remember: $('#rem').checked, think: $('#think').checked });
      KEY = $('#k').value; saveSettings(); updPrompt();
    };
    ['#k', '#base', '#model', '#conc', '#pin', '#pout', '#extra', '#rem', '#think'].forEach(x => { $(x).oninput = upd; $(x).onchange = upd; });
    updPrompt();
  }
  if (kind === 'export') {
    $('#impJson').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const p = JSON.parse(await f.text());
        if (p.sig !== S.sig) { toast(t('impBad')); return; }
        Object.assign(S, { dec: p.dec || {}, star: p.star || {}, note: p.note || {}, ai: p.ai || {}, others: p.others || {}, final: p.final || {}, hist: [] });
        if (p.crit) { S.crit = p.crit; saveCrit(); }
        save(); closeModal(); if (S.view === 'main') renderMain(); else renderSetup(); toast(t('impOk'));
      } catch (err) { toast(t('impBad')); }
    };
  }
}

/* ================= 多人：导出、导入、对比 ================= */
function exportMine() {
  const records = S.records.map(r => ({ mk: r.mk, key: r.key, title: r.title, year: r.year, d: S.dec[r.id]?.d || '', ec: S.dec[r.id]?.ec || '', note: S.note[r.id] || '', star: S.star[r.id] ? 1 : 0 }));
  download(`${LANG === 'zh' ? '筛选结果' : 'screening-results'}_${myRid()}.json`,
    JSON.stringify({ app: 'abs-screener', kind: 'reviewer-results', v: 2, rid: myRid(), at: new Date().toISOString(), crit: S.crit, records }, null, 1), 'application/json');
}
async function importOthers(files) {
  const byMk = new Map(S.records.map(r => [r.mk, r.id]));
  for (const f of files) {
    let p; try { p = JSON.parse(await f.text()); } catch (e) { toast(t('impBadTeam')); continue; }
    if (p.kind !== 'reviewer-results' || !Array.isArray(p.records)) { toast(t('impBadTeam')); continue; }
    const rid = String(p.rid || f.name.replace(/\.json$/i, '')).trim();
    if (rid === myRid()) { toast(t('impMineSkip', rid)); continue; }
    const dec = {}, note = {}; let hit = 0, miss = 0;
    p.records.forEach(x => {
      const id = byMk.get(x.mk); if (!id) { miss++; return; }
      if (x.d === 'keep' || x.d === 'excl') { dec[id] = { d: x.d, ec: x.ec || '' }; hit++; }
      if (x.note) note[id] = x.note;
    });
    S.others[rid] = { dec, note, at: p.at || '', crit: p.crit || null };
    toast(t('importedRv', rid, hit) + (miss ? ' · ' + t('impNotMatched', miss) : ''));
  }
  save(); if (S.view === 'main') renderMain(); openModal('team');
}
function exportCompare() {
  const zh = LANG === 'zh', R = reviewers();
  const lab = d => (d ? (d.d === 'keep' ? (zh ? '保留' : 'keep') : (zh ? '排除' : 'exclude')) : '');
  const stl = { agree: zh ? '一致' : 'agree', conflict: zh ? '有分歧' : 'disagree', partial: zh ? '没筛完' : 'incomplete' };
  const H = [zh ? '序号' : 'No.', zh ? '题目' : 'Title', zh ? '年份' : 'Year',
    ...R.flatMap(x => [x.rid, `${x.rid} ${zh ? '理由' : 'reason'}`, `${x.rid} ${zh ? '备注' : 'note'}`]),
    zh ? '是否一致' : 'Agreement', zh ? '最终' : 'Final', zh ? '最终理由' : 'Final reason'];
  const rows = S.records.map((r, i) => { const f = finalOf(r.id); return [i + 1, r.title, r.year, ...R.flatMap(x => [lab(x.dec[r.id]), x.dec[r.id]?.ec || '', x.note[r.id] || '']), stl[status(r.id)], lab(f), f?.ec || '']; });
  download((zh ? '多人筛选对比表' : 'reviewer-comparison') + '.csv', '﻿' + [H, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function prismaText() {
  const tot = S.files.reduce((a, f) => a + f.recs.length, 0), zh = LANG === 'zh';
  let k = 0, x = 0; const reasons = {};
  S.records.forEach(r => { const d = decOf(r.id); if (d?.d === 'keep') k++; else if (d?.d === 'excl') { x++; const c = d.ec || t('pNoReason'); reasons[c] = (reasons[c] || 0) + 1; } });
  const ecText = Object.fromEntries(EC().map(e => [e.code, e.text]));
  const per = S.files.map(f => `${f.name} ${f.recs.length}`).join(zh ? '；' : '; ');
  const L = [`${t('pImported')}: ${tot}${zh ? `（${per}）` : ` (${per})`}`, `${t('pDup')}: ${S.dups.length}`, `${t('pAfter')}: ${S.records.length}`,
    `${t('pScreened')}${hasTeam() ? t('pFinal') : ''}: ${k + x}`, `  ${t('pExcl')}: ${x}`];
  Object.entries(reasons).sort((a, b) => b[1] - a[1]).forEach(([c, n]) => L.push(`    ${c}${ecText[c] ? ' ' + ecText[c] : ''}: ${n}`));
  L.push(`  ${t('pKept')}: ${k}`);
  if (hasTeam()) { const ts = teamStats(); if (ts.conf > ts.res) L.push(`  ${t('pUnres')}: ${ts.conf - ts.res}`); if (ts.part) L.push(`  ${t('pTodo')}: ${ts.part}`); }
  else if (S.records.length - k - x) L.push(`  ${t('pTodo')}: ${S.records.length - k - x}`);
  const aiN = S.records.filter(r => S.ai[r.id] && !S.ai[r.id].err).length;
  const both = S.records.filter(r => S.dec[r.id] && S.ai[r.id] && !S.ai[r.id].err), agree = both.filter(r => !differs(r.id)).length;
  if (aiOn() && aiN) L.push(`${t('pAI')}: ${aiN}${both.length ? ` · ${t('pAgree')} ${agree}/${both.length}（${Math.round(100 * agree / both.length)}%）` : ''}`);
  if (hasTeam()) L.push('', teamReport());
  return L.join('\n');
}
function csvCell(v) { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv() {
  const zh = LANG === 'zh';
  const H = zh ? ['序号', '引用键', '来源文件', '题目', '作者', '年份', '出处', '我的判断', '排除理由', '星标', '备注', 'AI 建议', 'AI 依据的标准', 'AI 理由', 'AI 证据', '和 AI 一致']
    : ['No.', 'Keys', 'Files', 'Title', 'Authors', 'Year', 'Venue', 'My decision', 'Exclusion reason', 'Starred', 'Note', 'AI suggestion', 'AI criterion', 'AI reason', 'AI evidence', 'Agrees with AI'];
  const lab = { keep: zh ? '保留' : 'keep', excl: zh ? '排除' : 'exclude' };
  const al = { include: zh ? '建议保留' : 'include', exclude: zh ? '建议排除' : 'exclude', unsure: zh ? '看不出来' : 'unsure' };
  const rows = S.records.map((r, i) => {
    const d = S.dec[r.id], a = S.ai[r.id], ok = a && !a.err;
    return [i + 1, r.uids.map(u => u.split(':').slice(1).join(':')).join(' | '), r.files.join(' | '), r.title, r.authors.join('; '), r.year, r.venue,
      d ? lab[d.d] : (zh ? '未筛' : 'not screened'), d?.ec || '', S.star[r.id] ? '★' : '', S.note[r.id] || '',
      ok ? al[a.decision] : (a?.err ? 'error' : ''), ok ? a.criterion : '', ok ? a.reason : '', ok ? a.evidence.join(' | ') : '',
      d && ok ? (differs(r.id) ? (zh ? '否' : 'no') : (zh ? '是' : 'yes')) : ''];
  });
  download((zh ? '摘要筛选结果' : 'abstract-screening') + (multi() ? '_' + myRid() : '') + '.csv', '﻿' + [H, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function exportBib() {
  const keep = S.records.filter(r => decOf(r.id)?.d === 'keep');
  download((LANG === 'zh' ? '保留进入全文' : 'kept-for-full-text') + '.bib', keep.map(r => r.raw).join('\n\n') + '\n', 'text/plain;charset=utf-8');
}
function exportJson() {
  download((LANG === 'zh' ? '筛选进度备份' : 'screening-progress') + (multi() ? '_' + myRid() : '') + '.json',
    JSON.stringify({ app: 'abs-screener', v: 2, sig: S.sig, dec: S.dec, star: S.star, note: S.note, ai: S.ai, others: S.others, final: S.final, crit: S.crit, at: new Date().toISOString() }, null, 1), 'application/json');
}

/* ================= 事件 ================= */
async function aiOne() {
  const r = S.records[S.cur]; if (!r) return;
  if (!KEY.trim()) { S.setTab = 'api'; openModal('settings'); toast(t('needKey')); return; }
  if (!IC().length && !EC().length) { toast(t('needCrit')); return; }
  const ctrl = new AbortController();
  delete S.ai[r.id];
  const box = $('#side .aibox'); if (box) box.innerHTML = `<h3><span>✦ ${t('aiTitle')}</span></h3><p class="mutedp">…</p>`;
  try { S.ai[r.id] = await callAI(r, ctrl.signal); } catch (e) { S.ai[r.id] = { err: e.message }; }
  save(); renderAll(); refreshAIModal();
}
document.addEventListener('click', e => {
  const menu = $('#menu');
  if (menu && !e.target.closest('.menu-wrap')) menu.classList.add('hidden');
  const b = e.target.closest('[data-act],[data-filter],[data-go],[data-ec],[data-ev],[data-tab],[data-mode]'); if (!b) return;
  if (b.dataset.tab) { S.setTab = b.dataset.tab; openModal('settings'); return; }
  if (b.dataset.mode) { setMode(b.dataset.mode); return; }
  if (menu && b.closest('#menu')) menu.classList.add('hidden');
  if (b.dataset.filter) { S.filter = b.dataset.filter; const vis = visible(); if (vis.length && !vis.some(([, i]) => i === S.cur)) S.cur = vis[0][1]; renderList(); renderCard(); renderSide(); return; }
  if (b.dataset.go) { S.cur = +b.dataset.go; save(); renderList(); renderCard(); renderSide(); return; }
  if (b.dataset.ec) { decide('excl', b.dataset.ec); return; }
  if (b.dataset.ev) { const m = document.querySelectorAll(`mark.ev[data-q="${b.dataset.ev}"]`); if (m.length) { m[0].scrollIntoView({ block: 'center', behavior: 'smooth' }); m.forEach(x => { x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash'); }); } return; }
  const act = b.dataset.act;
  ({
    lang: () => setLang(LANG === 'zh' ? 'en' : 'zh'),
    settings: () => openModal('settings'),
    guide: () => { S.setTab = 'help'; openModal('settings'); },
    openApi: () => { S.setTab = 'api'; openModal('settings'); },
    example: () => { $('#icText').value = EXAMPLE[LANG].ic; $('#ecText').value = EXAMPLE[LANG].ec; $('#hlKeep').value = EXAMPLE.keep; $('#hlExcl').value = EXAMPLE.excl; $('#hlMore').open = true; $('#icText').dispatchEvent(new Event('input')); },
    clearFiles: () => { S.files = []; afterFilesChanged(); },
    start: async () => {
      if (!S.records.length) return;
      if (multi() && !String(S.settings.rid || '').trim()) { toast(t('needRid')); $('[data-ridinput]')?.focus(); return; }
      if (S.loadedSig !== S.sig) await load();
      S.view = 'main'; store.set('view', 'main'); renderMain();
    },
    home: () => { S.view = 'setup'; store.set('view', 'setup'); closeModal(); renderSetup(); },
    dups: () => openModal('dups'), help: () => { S.setTab = 'help'; openModal('settings'); },
    ai: () => { if (aiOn()) openModal('ai'); else { S.setTab = 'api'; openModal('settings'); } },
    crit: () => openModal('crit'), export: () => openModal('export'), team: () => openModal('team'),
    close: () => { closeModal(); if (S.view === 'main') renderMain(); },
    excl: () => decide('excl'), keep: () => decide('keep'), undo, prev: () => go(-1), next: () => go(1),
    menu: () => $('#menu').classList.toggle('hidden'),
    noteOpen: () => { S.noteOpen = S.records[S.cur].id; renderCard(); },
    star: () => { const r = S.records[S.cur]; if (S.star[r.id]) delete S.star[r.id]; else S.star[r.id] = 1; save(); renderCard(); renderList(); },
    aiOne, aiStart: () => {
      if (!KEY.trim()) { toast(t('needKey')); S.setTab = 'api'; openModal('settings'); return; }
      if (!IC().length && !EC().length) { toast(t('needCrit')); return; }
      runAI(AI.paused && AI.queue.length ? AI.queue.slice() : aiTargets(S.settings.scope));
    },
    aiPause: () => { AI.paused = true; refreshAIModal(); },
    aiStop: () => { AI.queue = []; AI.ctrl?.abort(); },
    aiRetry: () => runAI(S.records.filter(r => S.ai[r.id]?.err).map(r => r.id)),
    exCsv: exportCsv, exBib: exportBib, exJson: exportJson, exMine: exportMine, exCompare: exportCompare,
    rmRv: () => { delete S.others[b.dataset.rv]; if (!hasTeam()) S.mode = 'self'; save(); if (S.view === 'main') renderMain(); openModal('team'); },
    startTeam: () => { closeModal(); if (S.view !== 'main') { S.view = 'main'; store.set('view', 'main'); } setMode('team'); },
    copyPrisma: () => { navigator.clipboard?.writeText(prismaText()).then(() => toast(t('copied'))); },
    copyReport: () => { navigator.clipboard?.writeText(teamReport()).then(() => toast(t('copied'))); },
  }[act] || (() => {}))();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#menu')?.classList.add('hidden'); if ($('#mask')) { closeModal(); if (S.view === 'main') renderMain(); } else if (document.activeElement) document.activeElement.blur(); return; }
  if (S.view !== 'main' || $('#mask')) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'x' || k === 'X') { e.preventDefault(); decide('excl'); }
  else if (k === 'ArrowRight' || k === 'k' || k === 'K') { e.preventDefault(); decide('keep'); }
  else if (/^[1-9]$/.test(k)) { const ec = EC()[+k - 1]; if (ec) { e.preventDefault(); decide('excl', ec.code); } }
  else if (k === 'z' || k === 'Z' || k === 'Backspace') { e.preventDefault(); undo(); }
  else if (k === 'ArrowUp') { e.preventDefault(); go(-1); }
  else if (k === 'ArrowDown') { e.preventDefault(); go(1); }
  else if (k === 's' || k === 'S') { e.preventDefault(); $('[data-act="star"]')?.click(); }
  else if (k === 'n' || k === 'N') { e.preventDefault(); if ($('#note')) $('#note').focus(); else { S.noteOpen = S.records[S.cur].id; renderCard(); } }
  else if (k === '?') { S.setTab = 'help'; openModal('settings'); }
});
document.addEventListener('change', e => {
  const inp = e.target.closest('input[data-pick]');
  if (inp) { addFiles([...inp.files], inp.dataset.pick === 'dir'); inp.value = ''; return; }
  if (e.target.name === 'team_s' || e.target.name === 'team_m') setMulti(e.target.value === 'multi');
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.ridinput) { S.settings.rid = e.target.value.trim(); saveSettings(); }
});
window.addEventListener('beforeunload', save);

// 打开页面时：上次导入的文献还在，就直接恢复；上次在筛选页，就回到筛选页
(async function init() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  const saved = await DB.get('files');
  if (Array.isArray(saved) && saved.length) {
    S.files = saved.map(f => ({ name: f.name, text: f.text, recs: parseBib(f.text || '', f.name) })).filter(f => f.recs.length);
    rebuild();
    if (S.records.length) {
      await load();
      if (store.get('view', 'setup') === 'main') { S.view = 'main'; renderMain(); toast(t('restored')); return; }
    }
  }
  renderSetup();
})();
})();
